<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Fit Calc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a phone-first three-step flow (homes → condition → compare). The compare step reads like a closing statement: list price, plus updates, equals move-in ready. */
:root {
  --paper: #f4f6f5; --sheet: #ffffff; --ink: #1c2629; --ink-2: #4d5b60; --ink-3: #7d8a8e;
  --rule: #dbe1e0; --rule-2: #c5cecd;
  --accent: #2c5f7c; --accent-ink: #ffffff; --accent-soft: #e3edf2; --accent-text: #2c5f7c; --cta: #2c5f7c; --hl: #e5ad1c; --hl-soft: #fbf1d3;
  --chip-ink-ok: var(--ok); --chip-ink-warn: var(--warn); --chip-ink-bad: var(--bad);
  --r-btn: 8px; --r-card: 8px; --display-weight: 600; --display-case: none;
  --ok: #2f7a4f; --ok-soft: #e1f1e7; --warn: #a66a00; --warn-soft: #fbefd8; --bad: #b23a2c; --bad-soft: #f8e2df;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181a; --sheet: #192124; --ink: #e5ecec; --ink-2: #a9b6b8; --ink-3: #75858a; --rule: #263135; --rule-2: #34424a;
    --accent: #7fb5d3; --accent-ink: #0f1a20; --accent-soft: #1d3240; --accent-text: #7fb5d3; --cta: #7fb5d3; --hl: #f0c14b; --hl-soft: #3a3118;
    --ok: #6fc796; --ok-soft: #173025; --warn: #e8b04f; --warn-soft: #3a2c12; --bad: #f08a7c; --bad-soft: #3d1e1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12181a; --sheet: #192124; --ink: #e5ecec; --ink-2: #a9b6b8; --ink-3: #75858a; --rule: #263135; --rule-2: #34424a;
  --accent: #7fb5d3; --accent-ink: #0f1a20; --accent-soft: #1d3240; --accent-text: #7fb5d3; --cta: #7fb5d3; --hl: #f0c14b; --hl-soft: #3a3118;
  --ok: #6fc796; --ok-soft: #173025; --warn: #e8b04f; --warn-soft: #3a2c12; --bad: #f08a7c; --bad-soft: #3d1e1a;
  color-scheme: dark;
}
/* SettleSavvy view: values from the SettleSavvy Brand Guidelines. The brand defines one light look, so this view stays light in every theme. */
:root[data-brand="ss"] {
  --paper: #f9f8f6; --sheet: #FFFFFF; --ink: #1e293b; --ink-2: #374151; --ink-3: #6b7280; --rule: #E0E0E0; --rule-2: #E0E0E0;
  --accent: #089A9A; --accent-ink: #FFFFFF; --accent-text: #067373; --cta: linear-gradient(135deg, #089A9A, #067373);
  --accent-soft: color-mix(in srgb, #089A9A 12%, #FFFFFF); --hl: #F48B5A; --hl-soft: color-mix(in srgb, #F48B5A 16%, #FFFFFF);
  --ok: #67B438; --ok-soft: color-mix(in srgb, #67B438 18%, #FFFFFF); --warn: #FFA500; --warn-soft: color-mix(in srgb, #FFA500 20%, #FFFFFF);
  --bad: #dc3545; --bad-soft: color-mix(in srgb, #dc3545 14%, #FFFFFF);
  --chip-ink-ok: #1e293b; --chip-ink-warn: #1e293b; --chip-ink-bad: #1e293b;
  --display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-btn: 8px; --r-card: 12px; --display-weight: 800;
  color-scheme: light;
}
:root[data-brand="ss"] body { color: #374151; }
:root[data-brand="ss"] h1 { font-weight: 800; letter-spacing: -.01em; }
:root[data-brand="ss"] h2, :root[data-brand="ss"] .verdict .big { font-weight: 700; letter-spacing: -.01em; }
:root[data-brand="ss"] .avatar { width: 72px; height: 72px; }
:root[data-brand="ss"] .agent { grid-template-columns: 72px minmax(0, 1fr); }
:root[data-brand="ss"] .card { box-shadow: 0 1px 3px rgba(30, 41, 59, .06); }
:root[data-brand="ss"] .card:hover { border-color: #089A9A; }
:root[data-brand="ss"] .wordmark { text-transform: none; letter-spacing: -.01em; font-size: 22px; font-weight: 800; color: #141722; }
:root[data-brand="ss"] .wordmark img { display: block; }
:root[data-brand="ss"] .btn.primary:hover { opacity: .9; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); transition: background .2s; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 120px; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(30px, 6vw, 42px); }
h2 { font-size: 24px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); font-weight: 600; font-family: var(--body); }
p { margin: 0; }
a { color: var(--accent-text); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .small { font-size: 13px; } .tiny { font-size: 12px; color: var(--ink-3); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-card); }

/* brand bar */
.brandbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.wordmark { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); display: inline-flex; align-items: center; gap: 8px; }
.wordmark svg { display: block; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 99px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps button { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: grid; gap: 6px; font-size: 13px; color: var(--ink-3); }
.steps button:disabled { cursor: default; }
.steps button i { display: block; height: 4px; border-radius: 2px; background: var(--rule); }
.steps button[aria-current="step"] { color: var(--ink); font-weight: 600; }
.steps button[aria-current="step"] i, .steps button.done i { background: var(--accent); }

/* forms */
.field { width: 100%; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 6px; padding: 10px 12px; min-height: 44px; }
.label { display: grid; gap: 4px; }
.label > span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.homeform { padding: 16px; display: grid; gap: 12px; }
.homeform .tag { justify-self: start; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; color: var(--accent-text); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: var(--r-btn); padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--cta); color: var(--accent-ink); border-color: transparent; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-text); padding-inline: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }

/* condition step */
.cond-head { padding: 16px; display: grid; gap: 4px; }
.cond-head .price { font-family: var(--mono); font-size: 22px; }
.ask { display: grid; gap: 10px; padding: 0 16px 16px; }
.ask p { font-size: 17px; font-weight: 500; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice button { border: 1.5px solid var(--rule-2); background: var(--sheet); border-radius: 10px; padding: 14px; min-height: 64px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.choice button b { font-weight: 600; }
.choice button span { font-size: 12px; color: var(--ink-3); }
.choice button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.picker { display: grid; gap: 18px; }
.picker-group { display: grid; gap: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.tile { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 10px; display: grid; min-width: 0; }
.tile[data-on="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile-btn { border: 0; background: none; text-align: left; cursor: pointer; padding: 12px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; min-height: 56px; }
.tick { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--rule-2); display: grid; place-items: center; color: transparent; }
.tile[data-on="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile-btn b { font-weight: 500; display: block; line-height: 1.3; }
.tile-btn .est { font-size: 12px; color: var(--ink-3); }
.qtyrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px 12px 44px; }
.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--rule-2); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--paper); width: 40px; min-height: 40px; cursor: pointer; font-size: 18px; }
.stepper input { width: 72px; border: 0; text-align: center; background: var(--sheet); font-family: var(--mono); }
.unit { font-size: 12px; color: var(--ink-3); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sheet); border-top: 1px solid var(--rule); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.dock-in { max-width: 980px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.dock .sum { display: grid; line-height: 1.3; min-width: 0; }
.dock .sum b { font-family: var(--mono); font-weight: 500; }

/* report */
:root { --commute: #6b7280; }
:root[data-brand="ss"] { --commute: #003366; }
.prefs { padding: 14px 16px; display: grid; gap: 12px; }
.pref { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.pref .pl { display: grid; gap: 2px; flex: 1 1 220px; min-width: 0; }
.pref .pl b { font-weight: 500; }
.pref .pv { display: flex; align-items: center; gap: 12px; flex: 1 1 220px; justify-content: flex-end; }
.pref input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.pref .pv b { white-space: nowrap; min-width: 82px; text-align: right; }
.assume summary { cursor: pointer; color: var(--accent-text); font-size: 14px; }
.assume[open] { display: grid; gap: 10px; }
.assume[open] summary { margin-bottom: 4px; }
.score { display: flex; align-items: center; gap: 8px; }
.score .sbar { flex: 1; height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.score .sbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.score b { font-size: 15px; }
.stack .c { background: var(--commute); } .stack .n { background: var(--accent); }
.agent { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px 16px; border-color: var(--accent); background: var(--accent-soft); }
.avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-size: 26px; font-weight: 600; overflow: hidden; }
.agent .who { display: grid; gap: 2px; min-width: 0; }
.agent .who b { font-size: 17px; }
.agent .contact { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.agent .contact span { user-select: all; overflow-wrap: anywhere; }

.verdict { padding: 18px 16px; display: grid; gap: 6px; border-left: 4px solid var(--hl); }
.verdict .big { font-family: var(--display); font-size: clamp(26px, 5vw, 34px); font-weight: 600; line-height: 1.1; text-wrap: balance; }
.verdict .sub { color: var(--ink-2); }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.col { padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.col .hname { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.col .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); border: 1px solid var(--rule-2); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; font-family: var(--body); font-weight: 500; }
.ledger { display: grid; gap: 4px; }
.ledger .ln { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.ledger .ln .num { white-space: nowrap; }
.ledger .tot { border-top: 1.5px solid var(--ink); padding-top: 6px; margin-top: 2px; font-weight: 600; }
.ledger .tot .num { font-size: 18px; }
.ledger .rng { text-align: right; font-size: 11px; color: var(--ink-3); }
.stack { height: 12px; display: flex; border-radius: 3px; overflow: hidden; background: var(--rule); }
.stack i { display: block; height: 100%; }
.stack .p { background: var(--ink-3); } .stack .u { background: var(--hl); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.updates { display: grid; gap: 12px; }
.uhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px 8px; flex-wrap: wrap; }
.uline { border-top: 1px solid var(--rule); }
.uline > button { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; gap: 10px; align-items: center; min-height: 56px; }
.uline > button:hover { background: var(--paper); }
.uline .nm b { font-weight: 500; display: block; }
.uline .nm span { font-size: 12px; color: var(--ink-3); }
.uline .amt { text-align: right; display: grid; justify-items: end; gap: 2px; }
.uline .amt .num { white-space: nowrap; }
.uline svg { transition: transform .15s; color: var(--ink-3); }
.uline > button[aria-expanded="true"] svg { transform: rotate(90deg); }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--chip-ink-ok); } .chip.warn { background: var(--warn-soft); color: var(--chip-ink-warn); }
.chip.bad { background: var(--bad-soft); color: var(--chip-ink-bad); } .chip.acc { background: var(--accent-soft); color: var(--accent-text); }
.empty { padding: 14px 16px; color: var(--ink-2); border-top: 1px solid var(--rule); }

.tune { padding: 4px 16px 16px; display: grid; gap: 12px; }
.tune .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.tune .seg button { padding: 8px 12px; }
.srcwrap { overflow-x: auto; }
.src { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 460px; }
.src th, .src td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.src th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.src .r { text-align: right; }
.src .note { color: var(--ink-3); font-size: 12px; }
.askbox { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
.askbox p { font-size: 13px; flex: 1 1 220px; }

.inbox .req { border-top: 1px solid var(--rule); padding: 12px 16px; display: grid; gap: 8px; }
.inbox .req q { display: block; font-size: 14px; }
.inbox .req .act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inbox .req .act .field { width: 140px; }

.foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.foot > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
.foot ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 9; max-width: calc(100% - 32px); }

@media (max-width: 640px) {
  .cols { grid-template-columns: 1fr 1fr; gap: 8px; }
  .col { padding: 12px 10px; }
  .col .hname { font-size: 17px; }
  .ledger .ln { font-size: 13px; flex-direction: column; gap: 0; }
  .ledger .ln .num { text-align: left; }
  .ledger .rng { text-align: left; }
  .qtyrow { padding-left: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

// Buyer priorities. Commute math is a placeholder until the House Fit commute methodology is dropped in (see commuteAnnual).
const DEFAULT_PREFS = { nbhdPerPt: 1000, years: 7, costPerMile: 0.70, timePerHour: 25, weeks: 48 };

// ─── STATE (this viewer's comparison, kept in this browser) ──────────────────
const STORE_KEY = "lor-housefit-v1";
let state = load();
let open = null;          // expanded update line, "homeId:itemId"
let agentBids = {};       // itemId → [numbers] from the shared database, this market
let myRequests = {};      // "homeId:itemId" → latest request doc from this viewer
let inbox = [];           // pending requests (agents only)
let db = null, me = null, isAgent = false;

function blankHome(id) { return { id, name: "", price: null, sqft: null, asIs: null, nbhd: null, miles: null, mins: null, ups: {} }; }
function load() {
  const base = { brand: "lor", step: "report", cur: 0, prefs: { ...DEFAULT_PREFS }, ...structuredClone(EXAMPLE) };
  try {
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem("lor-movein-v1");
    if (raw) { const o = JSON.parse(raw); return { ...base, ...o, prefs: { ...DEFAULT_PREFS, ...(o.prefs || {}) }, commute: o.commute || { on: null, place: "", days: 5 } }; }
  } catch (e) {}
  return base;
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

// ─── PRICING ─────────────────────────────────────────────────────────────────
const factor = () => DATA.locationFactor?.value ?? 1;
const pick = (lo, hi, level) => level === "low" ? lo : level === "high" ? hi : (lo + hi) / 2;
function sourceRates(item, level) {
  return DATA.sources.map((s, i) => {
    const r = s.items[item.id];
    if (!r) return { s, i, v: null };
    const f = s.localized ? 1 : factor();
    return { s, i, r, v: pick(r.low, r.high, level) * f, lo: r.low * f, hi: r.high * f };
  });
}
function agentAvg(item) {
  const b = agentBids[item.id];
  return b && b.length ? b.reduce((a, x) => a + x, 0) / b.length : null;
}
// Blended unit rate: average of every published source, plus the market's agent bids as one more voice.
function rate(item, level) {
  const vals = sourceRates(item, level).filter(x => x.v != null).map(x => x.v);
  const a = agentAvg(item);
  if (a != null) vals.push(a);
  return vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : 0;
}
function agreement(item) {
  const mids = sourceRates(item, "mid").filter(x => x.v != null).map(x => x.v);
  if (mids.length < 2) return { cls: "warn", label: "1 source" };
  const mean = mids.reduce((a, b) => a + b, 0) / mids.length;
  const sp = (Math.max(...mids) - Math.min(...mids)) / mean;
  return sp <= .25 ? { cls: "ok", label: "Sources agree" } : sp <= .6 ? { cls: "warn", label: "Some spread" } : { cls: "bad", label: "Wide spread" };
}
// One update line → { lo, mid, hi, exact } where exact means the buyer narrowed it to one number.
function line(home, id) {
  const u = home.ups[id], item = ITEM[id], q = Number(u.qty) || 0;
  if (u.agent != null) { const v = q * u.agent; return { lo: v, mid: v, hi: v, exact: "agent" }; }
  if (u.level) { const v = q * rate(item, u.level); return { lo: v, mid: v, hi: v, exact: u.level }; }
  return { lo: q * rate(item, "low"), mid: q * rate(item, "mid"), hi: q * rate(item, "high"), exact: null };
}
function updatesTotal(home) {
  const t = { lo: 0, mid: 0, hi: 0 };
  if (home.asIs !== false) return t;
  for (const id in home.ups) { const l = line(home, id); t.lo += l.lo; t.mid += l.mid; t.hi += l.hi; }
  return t;
}

// Commute: round trips per year × (driving cost + time cost). Placeholder method; swap in the House Fit methodology here.
function commuteAnnual(home) {
  const c = state.commute, p = state.prefs;
  if (!c?.on || !(Number(home.miles) > 0 || Number(home.mins) > 0)) return 0;
  const trips = (Number(c.days) || 0) * p.weeks * 2;
  return trips * ((Number(home.miles) || 0) * p.costPerMile + (Number(home.mins) || 0) / 60 * p.timePerHour);
}
const hasScore = h => Number(h.nbhd) >= 1 && Number(h.nbhd) <= 100;
// Neighborhood: the lower-scoring home carries the point gap × what each point is worth to the buyer.
function nbhdGap(home) {
  const scored = state.homes.filter(hasScore);
  if (scored.length < 2 || !hasScore(home)) return 0;
  return (Math.max(...scored.map(h => Number(h.nbhd))) - Number(home.nbhd)) * state.prefs.nbhdPerPt;
}
function fit(home) {
  const u = updatesTotal(home), cAnn = commuteAnnual(home), c = cAnn * state.prefs.years, n = nbhdGap(home), p = Number(home.price) || 0;
  const base = p + c + n;
  return { u, cAnn, c, n, lo: base + u.lo, mid: base + u.mid, hi: base + u.hi, ready: p + u.mid };
}

// ─── FORMAT ──────────────────────────────────────────────────────────────────
const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const usd2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = v => v == null || isNaN(v) ? "—" : usd0.format(Math.round(v));
const k = v => v >= 1e6 ? "$" + (v / 1e6).toFixed(2) + "M" : v >= 1000 ? "$" + Math.round(v / 1000) + "k" : usd0.format(v);
const urate = v => v == null ? "—" : v < 100 ? usd2.format(v) : usd0.format(v);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hname = (h, i) => h.name || `Home ${String.fromCharCode(65 + i)}`;
const first = () => AGENT.name.split(" ")[0];
const chev = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
const check = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.5l2.6 2.6L11 4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
const LEVEL = { low: "Budget", mid: "Mid-range", high: "Upper" };
const qtyLabel = (it, q) => `${Number(q).toLocaleString()} ${it.unit}${Number(q) === 1 || /ft$/.test(it.unit) ? "" : "s"}`;

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const f = document.activeElement, fid = f?.id, sel = fid && f.selectionStart != null ? [f.selectionStart, f.selectionEnd] : null;
  document.documentElement.dataset.brand = state.brand;
  const app = document.getElementById("app");
  app.innerHTML = header() + (state.step === "homes" ? stepHomes() : state.step === "cond" ? stepCond() : stepReport());
  if (fid) { const n = document.getElementById(fid); if (n) { n.focus({ preventScroll: true }); if (sel) try { n.setSelectionRange(...sel); } catch (e) {} } }
}

function header() {
  const ss = state.brand === "ss";
  const mark = ss
    ? `<span class="wordmark"><img src="${SS_LOGO}" width="25" height="36" alt="">SettleSavvy</span>`
    : `<span class="wordmark"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2l4 9h-3v9h-2v-9H7z" fill="currentColor"/></svg>Lift Off Realty</span>`;
  const can = [true, state.homes.every(homeReady), state.homes.every(homeReady) && state.homes.every(h => h.asIs != null)];
  const steps = [["homes", "Homes"], ["cond", "Condition"], ["report", "Compare"]];
  const idx = steps.findIndex(s => s[0] === state.step);
  return `<div class="brandbar">${mark}
      <div class="seg" role="group" aria-label="Report view">
        <button type="button" data-brand="lor" aria-pressed="${!ss}">Lift Off Realty</button>
        <button type="button" data-brand="ss" aria-pressed="${ss}">SettleSavvy</button>
      </div></div>
    <div style="display:grid;gap:6px"><h1>House Fit Calc</h1>
      <p class="muted" style="max-width:62ch">Compare two homes the way you'd actually live in them: asking price, what it takes to make each one move-in ready, your commute, and how much the neighborhood matters to you. Priced for the ${MARKET.name}.</p></div>
    <nav class="steps" aria-label="Steps">${steps.map(([id, l], i) =>
      `<button type="button" data-step="${id}" ${state.step === id ? 'aria-current="step"' : ""} class="${i < idx ? "done" : ""}" ${can[i] ? "" : "disabled"}><i></i>${i + 1}. ${l}</button>`).join("")}</nav>`;
}
const homeReady = h => Number(h.price) > 0;

function stepHomes() {
  const c = state.commute || {};
  return `<section class="card homeform" aria-label="Commute">
      <div class="ask" style="padding:0"><p>Does anyone in your household commute to work or school?</p>
        <div class="choice">
          <button type="button" data-commute="yes" aria-pressed="${c.on === true}"><b>Yes</b><span>Count the commute from each home</span></button>
          <button type="button" data-commute="no" aria-pressed="${c.on === false}"><b>No</b><span>Leave commute out</span></button>
        </div></div>
      ${c.on ? `<div class="row2">
        <label class="label" for="cPlace"><span>Where to</span><input class="field" id="cPlace" value="${esc(c.place)}" placeholder="e.g. INL, EIRMC, downtown"></label>
        <label class="label" for="cDays"><span>Days per week</span><input class="field num" id="cDays" type="number" inputmode="numeric" min="0" max="7" value="${c.days ?? 5}"></label>
      </div>` : ""}
    </section>
    <section class="grid2" aria-label="Homes">
      ${state.homes.map((h, i) => `<div class="card homeform">
        <span class="tag">Home ${String.fromCharCode(65 + i)}</span>
        <label class="label" for="n-${h.id}"><span>Address or nickname</span><input class="field" id="n-${h.id}" data-h="${h.id}" data-f="name" value="${esc(h.name)}" placeholder="e.g. 1450 Sunnyside Rd"></label>
        <div class="row2">
          <label class="label" for="p-${h.id}"><span>Asking price</span><input class="field num" id="p-${h.id}" data-h="${h.id}" data-f="price" type="number" inputmode="numeric" min="0" step="1000" value="${h.price ?? ""}" placeholder="$"></label>
          <label class="label" for="s-${h.id}"><span>Finished sq ft</span><input class="field num" id="s-${h.id}" data-h="${h.id}" data-f="sqft" type="number" inputmode="numeric" min="0" value="${h.sqft ?? ""}"></label>
        </div>
        <label class="label" for="nb-${h.id}"><span>Neighborhood score (1–100)</span><input class="field num" id="nb-${h.id}" data-h="${h.id}" data-f="nbhd" type="number" inputmode="numeric" min="1" max="100" value="${h.nbhd ?? ""}" placeholder="From SettleSavvy"></label>
        ${c.on ? `<div class="row2">
          <label class="label" for="mi-${h.id}"><span>Miles, one way</span><input class="field num" id="mi-${h.id}" data-h="${h.id}" data-f="miles" type="number" inputmode="decimal" min="0" step="0.1" value="${h.miles ?? ""}"></label>
          <label class="label" for="mn-${h.id}"><span>Minutes, one way</span><input class="field num" id="mn-${h.id}" data-h="${h.id}" data-f="mins" type="number" inputmode="numeric" min="0" value="${h.mins ?? ""}"></label>
        </div>` : ""}
      </div>`).join("")}
    </section>
    <div class="card homeform"><label class="label" for="client"><span>Your name</span><input class="field" id="client" value="${esc(state.client)}" placeholder="So your agent knows who's asking"></label></div>
    <div class="actions"><button type="button" class="btn ghost" data-act="new">Start over with blank homes</button>
      <button type="button" class="btn primary" data-act="toCond" ${state.homes.every(homeReady) ? "" : "disabled"}>Next: check condition</button></div>`;
}

function stepCond() {
  const i = state.cur, h = state.homes[i], last = i === state.homes.length - 1;
  const t = updatesTotal(h), n = Object.keys(h.ups).length;
  const sq = Number(h.sqft) || 1800;
  return `<section class="card" aria-label="Condition of ${esc(hname(h, i))}">
      <div class="cond-head"><span class="tiny">Home ${i + 1} of ${state.homes.length}</span><h2>${esc(hname(h, i))}</h2><span class="price">${money(h.price)}</span></div>
      <div class="ask"><p>Would you buy this home and live in it as is?</p>
        <div class="choice">
          <button type="button" data-asis="yes" aria-pressed="${h.asIs === true}"><b>Yes, as is</b><span>It's move-in ready for me</span></button>
          <button type="button" data-asis="no" aria-pressed="${h.asIs === false}"><b>No, it needs work</b><span>Pick the updates it needs</span></button>
        </div></div>
    </section>
    ${h.asIs === false ? `<section class="picker" aria-label="Updates needed">
      <p class="muted">Tap each update this home needs to match what you'd call move-in ready. Quantities start from the home's size; adjust them if you know better.</p>
      ${CATEGORIES.map(c => `<div class="picker-group"><h3>${c.name}</h3><div class="tiles">
        ${ITEMS.filter(it => it.cat === c.id).map(it => {
          const u = h.ups[it.id], on = !!u, q = on ? u.qty : it.qty(sq);
          const lo = q * rate(it, "low"), hi = q * rate(it, "high");
          return `<div class="tile" data-on="${on}">
            <button type="button" class="tile-btn" data-pick="${it.id}" aria-pressed="${on}"><span class="tick">${check}</span><span><b>${it.name}</b><span class="est">${k(lo)}–${k(hi)}${on ? "" : ` for about ${qtyLabel(it, q)}`}</span></span></button>
            ${on ? `<div class="qtyrow"><span class="unit">${it.unitLong}</span><span class="stepper"><button type="button" data-step-q="${it.id}" data-d="-1" aria-label="Less">−</button><input id="q-${h.id}-${it.id}" data-q="${it.id}" type="number" inputmode="decimal" min="0" value="${u.qty}" aria-label="${it.name} quantity"><button type="button" data-step-q="${it.id}" data-d="1" aria-label="More">+</button></span></div>` : ""}
          </div>`;
        }).join("")}</div></div>`).join("")}
    </section>` : ""}
    <div class="dock"><div class="dock-in">
      <div class="sum"><span class="tiny">${esc(hname(h, i))}</span>${h.asIs === false ? `<b>${n} update${n === 1 ? "" : "s"} · ${k(t.lo)}–${k(t.hi)}</b>` : h.asIs ? "<b>Move-in ready as is</b>" : "<b>Answer the question above</b>"}</div>
      <div style="display:flex;gap:8px">${i > 0 ? `<button type="button" class="btn" data-act="prevHome">Back</button>` : ""}
      <button type="button" class="btn primary" data-act="${last ? "toReport" : "nextHome"}" ${h.asIs == null ? "disabled" : ""}>${last ? "See comparison" : "Next home"}</button></div>
    </div></div>`;
}

function stepReport() {
  const ss = state.brand === "ss", P = state.prefs, commuteOn = !!state.commute?.on;
  const H = state.homes.map((h, i) => ({ h, i, f: fit(h) }));
  const max = Math.max(...H.map(x => x.f.hi));
  const [A, B] = H;
  const listDiff = B.h.price - A.h.price, allDiff = B.f.mid - A.f.mid;
  const better = allDiff > 0 ? A : B, listCheaper = listDiff > 0 ? A : B;
  const flipped = listDiff !== 0 && allDiff !== 0 && better !== listCheaper;
  const overlap = Math.min(A.f.hi, B.f.hi) >= Math.max(A.f.lo, B.f.lo);
  const parts = ["updates", commuteOn && "commute", H.some(x => x.f.n) && "neighborhood"].filter(Boolean);
  const counted = parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts.at(-1) : parts[0];
  const verdict = Math.abs(allDiff) < 1000
    ? `Counting ${counted}, these homes come out about even.`
    : `Counting ${counted}, ${esc(hname(better.h, better.i))} comes out about ${money(Math.abs(allDiff))} ahead.`;
  const sub = `${flipped ? `That flips the list prices, where ${esc(hname(listCheaper.h, listCheaper.i))} looked ${money(Math.abs(listDiff))} cheaper. ` : `List prices differ by ${money(Math.abs(listDiff))}. `}${overlap ? "The ranges still overlap, so narrow the widest updates below before deciding." : "The ranges don't overlap, so the gap holds even at the extremes."}`;
  const scored = H.filter(x => hasScore(x.h)).length === 2;

  return `${ss ? agentCard() : ""}
    <section class="card verdict" aria-label="Result"><span class="tiny">${esc(hname(A.h, 0))} vs ${esc(hname(B.h, 1))}</span><p class="big">${verdict}</p><p class="sub">${sub}</p></section>

    <section class="card prefs" aria-label="Your priorities">
      <h3>Your priorities</h3>
      <label class="pref" for="pNb"><span class="pl"><b>How much the neighborhood matters</b><span class="tiny">Each point of neighborhood score is worth this much to you</span></span>
        <span class="pv"><input type="range" id="pNb" min="0" max="5000" step="250" value="${P.nbhdPerPt}" aria-describedby="pNbV"><b class="num" id="pNbV">${money(P.nbhdPerPt)} / pt</b></span></label>
      ${scored ? "" : `<p class="tiny">Add a neighborhood score to both homes to use this.</p>`}
      ${commuteOn ? `<label class="pref" for="pYrs"><span class="pl"><b>Years you'll commute from this home</b><span class="tiny">Commute cost = annual cost × years</span></span>
        <span class="pv"><span class="stepper"><button type="button" data-yrs="-1" aria-label="Fewer years">−</button><input id="pYrs" type="number" inputmode="numeric" min="0" max="40" value="${P.years}" aria-label="Years"><button type="button" data-yrs="1" aria-label="More years">+</button></span></span></label>
      <details class="assume"><summary>Commute assumptions</summary>
        <div class="row2">
          <label class="label" for="pCpm"><span>Driving cost per mile</span><input class="field num" id="pCpm" type="number" inputmode="decimal" min="0" step="0.01" value="${P.costPerMile}"></label>
          <label class="label" for="pVot"><span>Your time, per hour</span><input class="field num" id="pVot" type="number" inputmode="decimal" min="0" step="1" value="${P.timePerHour}"></label>
        </div>
        <p class="tiny">${esc(state.commute.days)} days a week × ${P.weeks} weeks × 2 trips. Driving cost defaults to the IRS 2025 mileage rate.</p>
      </details>` : ""}
    </section>

    <section class="cols" aria-label="Totals">${H.map(x => { const f = x.f; return `<div class="card col">
        <div class="hname">${esc(hname(x.h, x.i))}${x.h.example ? '<span class="tag">Example</span>' : ""}</div>
        ${hasScore(x.h) ? `<div class="score" title="Neighborhood score"><span class="tiny">Neighborhood</span><span class="sbar"><i style="width:${Number(x.h.nbhd)}%"></i></span><b class="num">${Number(x.h.nbhd)}</b></div>` : `<div class="score"><span class="tiny">Neighborhood score not added</span></div>`}
        <div class="ledger">
          <div class="ln"><span>List price</span><span class="num">${money(x.h.price)}</span></div>
          <div class="ln"><span>${x.h.asIs === false ? `+ ${Object.keys(x.h.ups).length} updates` : "+ updates"}</span><span class="num">${x.h.asIs === false ? money(f.u.mid) : "$0"}</span></div>
          ${x.h.asIs === false && f.u.hi > f.u.lo ? `<div class="rng num">${k(f.u.lo)} – ${k(f.u.hi)}</div>` : ""}
          ${commuteOn ? `<div class="ln"><span>+ Commute, ${P.years} yr${P.years === 1 ? "" : "s"}</span><span class="num">${money(f.c)}</span></div>
          <div class="rng num">${f.cAnn ? `${money(f.cAnn)} a year · ${Number(x.h.miles) || 0} mi, ${Number(x.h.mins) || 0} min` : "Add miles and minutes on Homes"}</div>` : ""}
          ${scored && P.nbhdPerPt ? `<div class="ln"><span>+ Neighborhood gap</span><span class="num">${money(f.n)}</span></div>
          ${f.n ? `<div class="rng num">${Number(H[1 - x.i].h.nbhd) - Number(x.h.nbhd)} pts × ${money(P.nbhdPerPt)}</div>` : `<div class="rng">Higher score</div>`}` : ""}
          <div class="ln tot"><span>House Fit cost</span><span class="num">${money(f.mid)}</span></div>
          ${f.hi > f.lo ? `<div class="rng num">${k(f.lo)} – ${k(f.hi)}</div>` : ""}
        </div>
        <div class="stack" aria-hidden="true"><i class="p" style="width:${x.h.price / max * 100}%"></i><i class="u" style="width:${f.u.mid / max * 100}%"></i><i class="c" style="width:${f.c / max * 100}%"></i><i class="n" style="width:${f.n / max * 100}%"></i></div>
        <span class="tiny num">${money(f.ready)} move-in ready${x.h.sqft ? ` · ${usd0.format(f.ready / x.h.sqft)}/sq ft` : ""}</span>
      </div>`; }).join("")}</section>
    <div class="legend"><span><i style="background:var(--ink-3)"></i>List price</span><span><i style="background:var(--hl)"></i>Updates</span>${commuteOn ? `<span><i style="background:var(--commute)"></i>Commute</span>` : ""}${scored ? `<span><i style="background:var(--accent)"></i>Neighborhood gap</span>` : ""}<span>Ranges run from budget to upper finishes.</span></div>

    <section class="updates" aria-label="Updates by home">
      <h2>Fine-tune the updates</h2>
      <p class="muted small">Every update starts as a wide range across all sources. Open one to set the quantity, pick a finish level${ss ? ", or ask your agent what it really costs here" : ""}.</p>
      ${H.map(x => updatesCard(x, ss)).join("")}
    </section>
    ${isAgent ? inboxCard() : ""}
    <div class="actions"><button type="button" class="btn" data-act="editHomes">Edit homes</button><button type="button" class="btn ghost" data-act="new">Start a new comparison</button></div>
    ${footer()}`;
}

function agentCard() {
  const initials = AGENT.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2);
  return `<section class="card agent" aria-label="Your agent">
      ${AGENT.photo ? `<img class="avatar" src="${esc(AGENT.photo)}" alt="${esc(AGENT.name)}">` : `<span class="avatar" aria-hidden="true">${esc(initials)}</span>`}
      <div class="who"><b>${esc(AGENT.name)}</b><span class="small muted">${esc(AGENT.role)}</span>
        <div class="contact">${AGENT.phone ? `<span class="num">${esc(AGENT.phone)}</span>` : ""}<span>${esc(AGENT.email)}</span></div></div>
    </section>`;
}

function updatesCard(x, ss) {
  const h = x.h, ids = Object.keys(h.ups);
  const head = `<div class="uhead"><h3>${esc(hname(h, x.i))}</h3><button type="button" class="btn ghost" data-edit-cond="${x.i}">${h.asIs === false ? "Change updates" : "Add updates"}</button></div>`;
  if (h.asIs !== false || !ids.length) return `<div class="card">${head}<div class="empty">${h.asIs === false ? "No updates picked yet." : "Move-in ready as is. No updates added."}</div></div>`;
  return `<div class="card">${head}${ids.map(id => {
    const it = ITEM[id], u = h.ups[id], l = line(h, id), key = h.id + ":" + id, isOpen = open === key;
    const req = myRequests[key];
    const status = u.agent != null ? `<span class="chip acc">Agent: ${urate(u.agent)}/${it.unit}</span>`
      : req?.status === "pending" ? `<span class="chip warn">Asked agent</span>`
      : u.level ? `<span class="chip acc">${LEVEL[u.level]}</span>` : (() => { const a = agreement(it); return `<span class="chip ${a.cls}">${a.label}</span>`; })();
    return `<div class="uline"><button type="button" data-open="${key}" aria-expanded="${isOpen}">
        <span class="nm"><b>${it.name}</b><span class="num">${qtyLabel(it, u.qty)}</span></span>
        <span class="amt"><span class="num">${l.exact ? money(l.mid) : `${k(l.lo)}–${k(l.hi)}`}</span>${status}</span>${chev}</button>
      ${isOpen ? tune(h, id, ss) : ""}</div>`;
  }).join("")}</div>`;
}

function tune(h, id, ss) {
  const it = ITEM[id], u = h.ups[id], key = h.id + ":" + id;
  const rows = sourceRates(it, u.level || "mid");
  const a = agentAvg(it), req = myRequests[key];
  const opts = [["", "Full range"], ["low", "Budget"], ["mid", "Mid"], ["high", "Upper"]];
  if (u.agent != null) opts.push(["agent", "Agent"]);
  const cur = u.agent != null ? "agent" : (u.level || "");
  let askHtml = "";
  if (ss) {
    askHtml = `<div class="askbox">
      <p>${req?.status === "pending" ? `Waiting on ${esc(first())}. The answer shows up here as soon as it comes in.`
        : req?.status === "answered" ? `${esc(first())} said ${urate(req.response)} per ${it.unit}. It's applied to this line.`
        : req?.status === "passed" ? `${esc(first())} passed on this one. Use the published range or ask a contractor.`
        : `Not sure about this one? Ask ${esc(first())} for a local price on ${esc(it.name.toLowerCase())}, per ${it.unit}.`}</p>
      ${req?.status === "pending" ? "" : `<button type="button" class="btn primary" data-request="${key}" ${db ? "" : "disabled"}>Request agent input</button>`}
      ${db ? "" : `<span class="tiny" style="flex-basis:100%">Agent requests need a signed-in view of this page.</span>`}
    </div>`;
  }
  return `<div class="tune">
    <div class="controls">
      <span class="stepper"><button type="button" data-tq="${key}" data-d="-1" aria-label="Less">−</button><input id="tq-${key}" data-tqi="${key}" type="number" inputmode="decimal" min="0" value="${u.qty}" aria-label="${it.name} quantity"><button type="button" data-tq="${key}" data-d="1" aria-label="More">+</button></span>
      <span class="unit">${it.unitLong}</span>
      <div class="seg" role="group" aria-label="Precision">${opts.map(([v, l]) => `<button type="button" data-lvl="${key}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>
    </div>
    ${askHtml}
    <div class="srcwrap"><table class="src"><thead><tr><th>Source</th><th class="r">Range per ${it.unit}</th><th class="r">${u.level ? LEVEL[u.level] : "Mid"}</th><th>Notes</th></tr></thead><tbody>
      ${rows.map(r => r.v == null ? `<tr><td>${esc(r.s.name)}</td><td class="r muted" colspan="2">No published figure</td><td></td></tr>`
        : `<tr><td><a href="${esc(r.r.url)}" target="_blank" rel="noopener">${esc(r.s.name)}</a></td><td class="r num">${urate(r.lo)} – ${urate(r.hi)}</td><td class="r num">${urate(r.v)}</td><td class="note">${esc(r.r.note || "")}${r.s.localized ? "" : " Scaled to local prices."}</td></tr>`).join("")}
      <tr><td>Agent bids, ${esc(MARKET.name)}</td><td class="r muted">${a != null ? `${agentBids[id].length} bid${agentBids[id].length === 1 ? "" : "s"}` : "none yet"}</td><td class="r num">${a != null ? urate(a) : "—"}</td><td class="note">${a != null ? "Counted as one more source in the average." : ""}</td></tr>
    </tbody></table></div>
  </div>`;
}

function askMessage(it) {
  return `${state.client || "Your client"} has requested your input on what ${it.ask} would cost in this area. Reply with a number or "pass" if you have no insight on the upgrade.`;
}

function inboxCard() {
  return `<section class="card inbox" aria-label="Agent requests">
    <div class="uhead"><h3>Agent requests · ${esc(MARKET.name)}</h3><span class="tiny">${inbox.length} waiting</span></div>
    ${inbox.length ? inbox.map(r => `<div class="req"><q>${esc(r.message)}</q>
      <div class="act"><input class="field num" id="ans-${r.id}" type="number" inputmode="decimal" min="0" step="any" placeholder="$ per ${esc(ITEM[r.item]?.unit || "unit")}" aria-label="Your number">
        <button type="button" class="btn primary" data-answer="${r.id}">Send number</button><button type="button" class="btn" data-pass="${r.id}">Pass</button></div></div>`).join("")
      : `<div class="empty">No requests waiting.</div>`}
  </section>`;
}

function footer() {
  return `<section class="foot" aria-label="How this works">
    <div><h2>How the numbers work</h2><ul>
      <li>Each update is priced per unit from three published sources, then averaged. Agent bids from the ${esc(MARKET.name)} count as a fourth voice once they exist.</li>
      <li>National sources are scaled by ${factor().toFixed(2)}, Craftsman's 2025 adjustment for Idaho Falls. Homewyse already prices by ZIP code.</li>
      <li>Every home in the ${esc(MARKET.name)} uses the same rates, so comparisons stay fair across neighborhoods.</li>
      <li>Ranges run from budget to upper finishes. Pick a finish level or get an agent's number to narrow a line to one figure.</li>
      <li>Neighborhood scores come from SettleSavvy (1–100). The lower-scoring home carries the point gap times what you said each point is worth.</li>
      <li>Commute cost is round trips per year times driving cost per mile plus the value of your time, multiplied by the years you expect to live there.</li>
    </ul></div>
    <div><h2>Sources</h2><ul>${DATA.sources.map(s => `<li><a href="${esc(s.home)}" target="_blank" rel="noopener">${esc(s.name)}</a>: ${esc(s.summary)}</li>`).join("")}</ul>
      <p class="tiny">${esc(DATA.note || "")} Planning estimates, not bids. Get written bids before relying on any number.</p></div>
  </section>`;
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
const homeById = id => state.homes.find(h => h.id === id);
function commit() { save(); render(); }
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }
function untag(h) { h.example = false; }
const stepSize = id => ({ "sq ft": 50, "lin ft": 10 })[ITEM[id].unit] || 1;
const toTop = () => window.scrollTo(0, 0);

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.brand) { state.brand = d.brand; return commit(); }
  if (d.commute) { state.commute = { place: "", days: 5, ...(state.commute || {}), on: d.commute === "yes" }; return commit(); }
  if (d.yrs) { state.prefs.years = Math.max(0, Math.min(40, (Number(state.prefs.years) || 0) + Number(d.yrs))); return commit(); }
  if (d.step) { state.step = d.step; if (d.step === "cond") state.cur = 0; toTop(); return commit(); }
  if (d.act === "new") { state.homes = [blankHome("a"), blankHome("b")]; state.step = "homes"; state.cur = 0; open = null; toTop(); return commit(); }
  if (d.act === "toCond") { state.step = "cond"; state.cur = 0; toTop(); return commit(); }
  if (d.act === "nextHome") { state.cur++; toTop(); return commit(); }
  if (d.act === "prevHome") { state.cur--; toTop(); return commit(); }
  if (d.act === "toReport") { state.step = "report"; toTop(); return commit(); }
  if (d.act === "editHomes") { state.step = "homes"; toTop(); return commit(); }
  if (d.editCond != null) { state.step = "cond"; state.cur = Number(d.editCond); state.homes[state.cur].asIs = false; toTop(); return commit(); }
  const h = state.homes[state.cur];
  if (d.asis) { h.asIs = d.asis !== "no"; untag(h); return commit(); }
  if (d.pick) { untag(h); if (h.ups[d.pick]) delete h.ups[d.pick]; else h.ups[d.pick] = { qty: ITEM[d.pick].qty(Number(h.sqft) || 1800) }; return commit(); }
  if (d.stepQ) { const u = h.ups[d.stepQ]; u.qty = Math.max(0, (Number(u.qty) || 0) + Number(d.d) * stepSize(d.stepQ)); return commit(); }
  if (d.open) { open = open === d.open ? null : d.open; return render(); }
  if (d.tq) { const [hid, id] = d.tq.split(":"), u = homeById(hid).ups[id]; u.qty = Math.max(0, (Number(u.qty) || 0) + Number(d.d) * stepSize(id)); return commit(); }
  if (d.lvl) { const [hid, id] = d.lvl.split(":"), u = homeById(hid).ups[id];
    if (d.v === "agent") return;
    delete u.agent; u.level = d.v || null; return commit(); }
  if (d.request) return requestInput(d.request, t);
  if (d.answer) return answer(d.answer, false);
  if (d.pass) return answer(d.pass, true);
});

document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.h) { const h = homeById(d.h); h[d.f] = d.f === "name" ? t.value : (t.value === "" ? null : Number(t.value)); untag(h); return commit(); }
  if (t.id === "client") { state.client = t.value; return save(); }
  if (t.id === "cPlace") { state.commute.place = t.value; return save(); }
  if (t.id === "cDays") { state.commute.days = Math.min(7, Math.max(0, Number(t.value) || 0)); return save(); }
  const pref = { pNb: "nbhdPerPt", pYrs: "years", pCpm: "costPerMile", pVot: "timePerHour" }[t.id];
  if (pref) { if (t.value !== "") { state.prefs[pref] = Math.max(0, Number(t.value)); commit(); } return; }
  if (d.q) { state.homes[state.cur].ups[d.q].qty = t.value === "" ? 0 : Number(t.value); return commit(); }
  if (d.tqi) { const [hid, id] = d.tqi.split(":"); homeById(hid).ups[id].qty = t.value === "" ? 0 : Number(t.value); return commit(); }
});

// ─── AGENT REQUESTS (shared database) ────────────────────────────────────────
async function requestInput(key, btn) {
  if (!db) return;
  const [hid, id] = key.split(":"), h = homeById(hid), it = ITEM[id];
  btn.disabled = true;
  const message = askMessage(it);
  try {
    await db.collection("requests").add({
      market: MARKET.id, item: id, homeKey: key, homeName: h.name || "", client: state.client || "",
      by: me, message, status: "pending", createdAt: new Date().toISOString(),
      // Text delivery: a GoHighLevel workflow picks up queued messages, texts the agent, and writes the reply back.
      sms: { to: AGENT.phone || null, agent: AGENT.name, body: message, status: "queued" },
    });
    toast(`Request sent to ${first()}.`);
  } catch (err) {
    btn.disabled = false;
    toast(err?.code === "permission_denied" ? "You can't send requests from this view." : "The request didn't go through. Try again in a moment.");
  }
}

async function answer(reqId, pass) {
  const r = inbox.find(x => x.id === reqId); if (!r) return;
  const inp = document.getElementById("ans-" + reqId), v = Number(inp?.value);
  if (!pass && !(v > 0)) { inp?.focus(); return toast("Enter a dollar amount per unit, or tap Pass."); }
  try {
    await db.doc("requests/" + reqId).update({ status: pass ? "passed" : "answered", response: pass ? null : v, answeredAt: new Date().toISOString(), answeredBy: me });
    if (!pass) await db.collection("agentBids").add({ market: r.market, item: r.item, value: v, requestId: reqId, by: me, at: new Date().toISOString() });
    toast(pass ? "Marked as pass." : "Number sent and logged for the market.");
  } catch (err) { toast("That didn't save. Agent access is needed to answer requests."); }
}

// Apply an agent's answer to this viewer's comparison the moment it lands.
function applyResponses() {
  let changed = false;
  for (const key in myRequests) {
    const r = myRequests[key], [hid, id] = key.split(":"), u = homeById(hid)?.ups[id];
    if (r.status === "answered" && u && u.agentReq !== r.id) {
      u.agent = r.response; u.agentReq = r.id; u.level = null; changed = true;
      toast(`${first()} answered: ${urate(r.response)} per ${ITEM[id].unit} for ${ITEM[id].name.toLowerCase()}.`);
    }
  }
  if (changed) save();
}

async function connect() {
  const claude = window.claude; if (!claude?.use) return;
  const [d, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!d) return;
  db = d;
  me = user ? await user.id() : null;
  isAgent = user ? await user.canEdit() : false;
  render();
  db.collection("agentBids").where("market", "==", MARKET.id).onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(doc => { const x = doc.data(); if (x.value > 0) (m[x.item] ||= []).push(x.value); });
    agentBids = m; render();
  }, () => {});
  if (me) db.collection("requests").where("by", "==", me).onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(doc => { const x = { id: doc.id, ...doc.data() }; const p = m[x.homeKey]; if (!p || x.createdAt > p.createdAt) m[x.homeKey] = x; });
    myRequests = m; applyResponses(); render();
  }, () => {});
  if (isAgent) db.collection("requests").where("status", "==", "pending").onSnapshot(snap => {
    inbox = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(x => x.market === MARKET.id).sort((a, b) => a.createdAt < b.createdAt ? -1 : 1);
    render();
  }, () => {});
}

render();
connect();
</script>
</body>
</html>
