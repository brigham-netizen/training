function paintCounts() {
  const left = PG.ds.colors.map(() => 0);
  PG.ds.pieces.forEach((p, i) => { if (!PG.filled[i]) left[p.n]++; });
  return left;
}
function renderPalette() {
  const box = $('#tray'); box.innerHTML = '';
  const left = paintCounts();
  PG.ds.colors.forEach((c, n) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (PG.sel === n ? ' sel' : '') + (left[n] ? '' : ' done');
    b.innerHTML = `<span class="dot" style="background:${c.c};color:${lum(c.c) > .55 ? '#1a1208' : '#fff6e6'}">${left[n] ? n + 1 : '✓'}</span><span class="gn">${c.name}</span><span class="left">${left[n] ? left[n] + ' left' : 'done'}</span>`;
    b.setAttribute('aria-label', `Colour ${n + 1}, ${c.name}, ${left[n]} pieces left`);
    b.onclick = () => { PG.sel = n; sfx.paint('Y'); renderPalette(); refreshPaint(); };
    box.appendChild(b);
  });
  const sel = box.querySelector('.sel');
  if (sel) try { sel.scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' }); } catch (e) {}
}
function fillPiece(i) {
  const p = PG.ds.pieces[i];
  if (PG.filled[i]) return;
  if (p.n !== PG.sel) { toast(`That piece is number ${p.n + 1}, ${PG.ds.colors[p.n].name.toLowerCase()}.`); sfx.lift(); return; }
  PG.filled[i] = true;
  save.paint[PG.id] = PG.filled.map(f => f ? 1 : 0).join('');
  persist();
  sfx.paint(['R', 'Y', 'O', 'G', 'B', 'P', 'W'][p.n % 7]);
  refreshPaint(i);
  const left = paintCounts();
  if (!left[PG.sel]) {
    const nx = left.findIndex(v => v > 0);
    if (nx >= 0) { toast(`${PG.ds.colors[PG.sel].name} is finished.`); PG.sel = nx; refreshPaint(); }
    renderPalette();
  } else {
    const sw = $('#tray').children[PG.sel];
    if (sw) sw.querySelector('.left').textContent = left[PG.sel] + ' left';
  }
  if (PG.filled.every(Boolean)) paintWon();
}
function paintGlow(animate) {
  const b = paintBase(), g = PG.glow; g.innerHTML = '';
  el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, fill: 'url(#pz-sun)', style: 'mix-blend-mode:screen', class: animate ? 'mw-flash' : '' , opacity: animate ? '' : .35 }, g);
  const rng = mulberry32(PG.id + 5);
  for (let k = 0; k < 9; k++) {
    const x = b.x + b.w * (.15 + rng() * .7), y = b.y + b.h * (.15 + rng() * .7), s = b.w * (.012 + rng() * .012);
    const st = el('path', { d: `M${x},${y - s}Q${x},${y} ${x + s},${y}Q${x},${y} ${x},${y + s}Q${x},${y} ${x - s},${y}Q${x},${y} ${x},${y - s}Z`, fill: '#fffbe8', class: 'twinkle' }, g);
    st.style.animationDelay = (rng() * 3).toFixed(2) + 's';
  }
}
function paintWon() {
  PG.won = true; PG.winShown = false;
  sfx.win();
  setView(paintBase());
  paintGlow(!reduceMotion);
  PG.winTimer = setTimeout(showPaintWin, reduceMotion ? 300 : 1800);
}
function showPaintWin() {
  if (PG.winShown) return;
  PG.winShown = true; clearTimeout(PG.winTimer);
  const next = PG.id + 1, last = next >= PAINT_TOTAL();
  ov.innerHTML = `<div class="sheet"><h1>Completed</h1><h2>${PG.ds.name}</h2>
    <p class="inc">${PG.ds.pieces.length} pieces cut, painted and leaded.</p>
    <div class="levels-actions"><button class="btn" id="ov-next">${last ? 'Back to the workshop' : 'Next window'}</button><button class="btn ghost" id="ov-stay">Admire it</button></div></div>`;
  $('#ov-next').onclick = () => { closeOverlay(); last ? showLevels('paint') : startPaint(next); };
  $('#ov-stay').onclick = closeOverlay;
}
// Find: zoom to an unfinished piece of the chosen colour.
function paintFind() {
  if (PG.won) return;
  let i = PG.ds.pieces.findIndex((p, k) => !PG.filled[k] && p.n === PG.sel);
  if (i < 0) i = PG.filled.findIndex(f => !f);
  if (i < 0) return;
  const p = PG.ds.pieces[i], b = paintBase(), w = b.w / 3.2, h = w * b.h / b.w;
  setView({ x: p.lx - w / 2, y: p.ly - h / 2, w, h });
  const e = PG.els[i].path;
  e.classList.remove('found'); void e.getBBox(); e.classList.add('found');
}
// Pan, pinch and tap
const ptrs = new Map();
let pz = null;
function invAt(clientX, clientY, inv) { const p = scene.createSVGPoint(); p.x = clientX; p.y = clientY; return p.matrixTransform(inv); }
scene.addEventListener('pointerdown', e => {
  if (MODE !== 'paint' || !PG) return;
  if (PG.won && !PG.winShown) { showPaintWin(); return; }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { scene.setPointerCapture(e.pointerId); } catch (err) {}
  const inv = scene.getScreenCTM().inverse();
  if (ptrs.size === 1) pz = { mode: 'tap', sx: e.clientX, sy: e.clientY, inv, view0: { ...PG.view }, start: invAt(e.clientX, e.clientY, inv) };
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    pz = { mode: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), inv, view0: { ...PG.view }, m0: invAt(mid.x, mid.y, inv) };
  }
});
scene.addEventListener('pointermove', e => {
  if (MODE !== 'paint' || !PG || !pz || !ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pz.mode === 'tap' && Math.hypot(e.clientX - pz.sx, e.clientY - pz.sy) > 8) pz.mode = 'pan';
  if (pz.mode === 'pan') {
    const c = invAt(e.clientX, e.clientY, pz.inv);
    setView({ ...pz.view0, x: pz.view0.x - (c.x - pz.start.x), y: pz.view0.y - (c.y - pz.start.y) });
  } else if (pz.mode === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const f = pz.d0 / Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));
    const c0 = invAt((a.x + b.x) / 2, (a.y + b.y) / 2, pz.inv), v0 = pz.view0;
    const w = v0.w * f, h = v0.h * f;
    setView({ x: pz.m0.x - (c0.x - v0.x) * f, y: pz.m0.y - (c0.y - v0.y) * f, w, h });
  }
});
function endPtr(e) {
  if (MODE !== 'paint' || !PG || !ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (pz && pz.mode === 'tap' && e.type === 'pointerup') {
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const pe = hit && hit.closest && hit.closest('[data-p]');
    if (pe && !PG.won) fillPiece(+pe.dataset.p);
  }
  if (!ptrs.size) pz = null;
  else if (pz) pz.mode = 'done';
}
scene.addEventListener('pointerup', endPtr);
scene.addEventListener('pointercancel', endPtr);
scene.addEventListener('wheel', e => {
  if (MODE !== 'paint' || !PG) return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.15 : 1 / 1.15);
}, { passive: false });
function zoomAt(clientX, clientY, f) {
  const inv = scene.getScreenCTM().inverse(), m = invAt(clientX, clientY, inv), v = PG.view;
  setView({ x: m.x - (m.x - v.x) * f, y: m.y - (m.y - v.y) * f, w: v.w * f, h: v.h * f });
}
function zoomCentre(f) { const r = scene.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); }
const sceneThumbs = {};
function sceneThumb(id) {
  if (sceneThumbs[id]) return sceneThumbs[id];
  const m = MASTERPIECES[id - PAINT_DESIGNS.length], cv = document.createElement('canvas');
  cv.width = 152; cv.height = 212;
  const c = cv.getContext('2d'), P = {};
  for (const k in m.palette) P[k] = m.palette[k][1];
  c.scale(.4, .4); c.translate(-10, -10);
  const arch = archPath2D();
  c.save(); c.clip(arch); m.draw(c, P);
  c.lineWidth = 22; c.strokeStyle = P[m.frame[0]]; c.stroke(arch); c.restore();
  c.lineWidth = 4; c.strokeStyle = '#09080b'; c.stroke(arch);
  return sceneThumbs[id] = cv.toDataURL('image/png');
}
function paintThumb(id, dim) {
  if (isMasterpiece(id) && !paintCache[id]) return `<img src="${sceneThumb(id)}" alt="">`;
  const ds = getDesign(id), filled = paintSaved(id, ds.pieces.length);
  const [x, y, w, h] = ds.box;
  return `<svg viewBox="${x - 4} ${y - 4} ${w + 8} ${h + 8}" preserveAspectRatio="xMidYMid meet">` +
    ds.pieces.map((p, i) => `<path d="${p.d}" fill="${filled[i] ? ds.colors[p.n].c : dim ? '#2a2531' : '#d6cbb0'}" stroke="#09080b" stroke-width="1.4"/>`).join('') + '</svg>';
}

// ---------------------------------------------------------------- sound
const sfx = (() => {
  let ctx = null;
  function ac() {
    if (!save.sound) return null;
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type = 'sine', vol = .15, delay = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  const pitch = { R: 1318.5, Y: 1567.98, B: 1174.66, C: 1975.53, L: 196 };
  return {
    tick(p) { if (p === 'L') { tone(110, .25, 'triangle', .2); tone(220, .12, 'square', .03); } else { tone(pitch[p], .35, 'sine', .12); tone(pitch[p] * 2.76, .12, 'sine', .03); } },
    lift() { tone(880, .12, 'triangle', .06); },
    bell(h) { const f = { L: 293.66, S: 392, V: 261.63 }[h] || 392; tone(f, 2.2, 'sine', .12); tone(f * 2.01, 1.2, 'sine', .05); tone(f * 2.76, .7, 'sine', .03); },
    paint(c) { const f = { R: 1318.5, Y: 1567.98, O: 1396.9, G: 1174.66, B: 1046.5, P: 1244.5, W: 1975.5, K: 196, '.': 880 }[c] || 1200; tone(f, .22, c === 'K' ? 'triangle' : 'sine', .08); },
    win() { [293.66, 369.99, 440, 587.33].forEach((f, i) => { tone(f, 3, 'sine', .1, i * .22); tone(f * 2.01, 1.6, 'sine', .035, i * .22); }); },
  };
})();

// ---------------------------------------------------------------- boot
$('#z-in').onclick = () => zoomCentre(1 / 1.4);
$('#z-out').onclick = () => zoomCentre(1.4);
$('#btn-menu').setAttribute('aria-label', 'Windows list');
$('#btn-menu').onclick = () => showLevels(MODE);
$('#btn-hint').onclick = () => MODE === 'riddle' ? riddleHint() : MODE === 'mirror' ? mirrorHint() : MODE === 'paint' ? paintFind() : hint();
$('#btn-reset').onclick = () => {
  if (MODE === 'paint' && PG) setView(paintBase());
  else if (MODE === 'mirror' && MG) startMirror(MG.id);
  else if (MODE === 'riddle' && RG) startRiddle(RG.id);
  else if (G) { G.admiring = false; startLevel(G.id); }
};

window.claude?.hot?.snapshot?.(() => {
  if (MODE === 'riddle' && RG && !RG.won) return { mode: 'riddle', id: RG.id, board: RG.board, locked: RG.locked, hour: RG.hour };
  return G && !G.won ? { id: G.id, board: G.board, locked: G.locked, inv: G.inv, hour: G.hour, sel: G.sel } : {};
});
function boot(data) {
  if (data && data.mode === 'riddle' && RIDDLES[data.id]) { startRiddle(data.id, data); return; }
  if (data && data.board && typeof data.id === 'number') { startLevel(data.id, data); return; }
  // Load a window quietly behind the nave so the header has a game to return to.
  startLevel(Math.min(save.unlocked, CAMPAIGN.length - 1));
  showHome();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
