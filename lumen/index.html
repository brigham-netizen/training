<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#110e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lumen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: one-screen portrait app. Header strip, the nave (SVG scene) fills the middle, controls docked below. */
:root {
  --night: #110e16;        /* nave in darkness */
  --stone: #241f2b;        /* dressed stone */
  --stone-hi: #3a3342;     /* worn edges */
  --lead: #09080b;         /* lead came */
  --vellum: #eadfc6;       /* text */
  --vellum-dim: #a89c86;
  --gilt: #d6a542;         /* accent: gilding */
  --gilt-dim: #8a6a2c;
  --font-title: "UnifrakturMaguntia", "Old English Text MT", Georgia, serif;
  --font-label: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --font-body: "IM Fell English", "Palatino Linotype", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--vellum);
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; border-radius: 4px; }

#app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  max-width: 560px; margin: 0 auto;
  gap: 6px;
}

header { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.title-block { flex: 1; min-width: 0; text-align: center; line-height: 1.05; }
.title-block .num { font-family: var(--font-label); font-size: 12px; letter-spacing: .18em; color: var(--gilt); }
.title-block .name.long { font-size: 18px; }
.title-block .name { font-family: var(--font-title); font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--stone-hi); background: var(--stone);
  color: var(--vellum);
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { transform: scale(.94); }

#scene-wrap { flex: 1; min-height: 0; position: relative; }
#scene { width: 100%; height: 100%; display: block; }
.pane-hit { cursor: pointer; }
.tile-hit { cursor: pointer; }

.lore {
  font-style: italic; font-size: 14.5px; line-height: 1.35; color: var(--vellum-dim);
  text-align: center; min-height: 2.7em; padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
}
.lore b { font-style: normal; color: var(--vellum); font-weight: normal; font-family: var(--font-label); letter-spacing: .04em; }

#hours { display: flex; gap: 6px; justify-content: center; }
.hour {
  flex: 1; max-width: 130px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 5px 4px 6px; border-radius: 10px;
  border: 1px solid var(--stone-hi); background: var(--stone);
}
.hour svg { width: 34px; height: 16px; }
.hour .hn { font-family: var(--font-label); font-size: 14px; letter-spacing: .06em; }
.hour .hs { font-size: 11.5px; color: var(--vellum-dim); font-variant-numeric: tabular-nums; }
.hour.on { border-color: var(--gilt); background: #2f2618; box-shadow: 0 0 14px #d6a54233 inset; }
.hour.done .hs { color: var(--gilt); }

#tray { display: flex; gap: 8px; justify-content: center; padding-top: 2px; }
.gem {
  position: relative; width: 54px; height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
  border-radius: 10px; padding-top: 5px;
  border: 1px solid transparent;
}
.gem svg { width: 30px; height: 34px; }
.gem .gn { font-family: var(--font-label); font-size: 11px; letter-spacing: .05em; color: var(--vellum-dim); }
.gem .ct {
  position: absolute; top: 1px; right: 3px; min-width: 18px; height: 18px; border-radius: 9px;
  background: var(--lead); border: 1px solid var(--stone-hi);
  font-size: 12px; line-height: 16px; text-align: center; font-variant-numeric: tabular-nums;
}
.gem.sel { border-color: var(--gilt); background: #2f2618; }
.gem.sel .gn { color: var(--vellum); }
.gem.empty { opacity: .35; }
.gem.flash { animation: flash .4s; }
@keyframes flash { 50% { background: #5a1f1f; } }

/* Overlays */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: #0a080df7;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  text-align: center; gap: 14px;
  animation: fadein .35s;
}
@keyframes fadein { from { opacity: 0; } }
.overlay { overflow-y: auto; justify-content: safe center; }
.overlay h3 { font-family: var(--font-label); font-weight: normal; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--gilt); margin: 4px 0 -4px; }
.overlay p.sub { font-size: 14px; margin-top: -6px; }
#riddle-grid { display: grid; grid-template-columns: repeat(4, 62px); gap: 10px; justify-content: center; }
.rv { width: 62px; height: 68px; position: relative; display: flex; align-items: flex-end; justify-content: center; }
.rv svg { position: absolute; inset: 0 0 6px; width: 100%; height: 62px; }
.rv span { position: relative; font-family: var(--font-label); font-size: 12px; background: #09080bcc; border-radius: 6px; padding: 0 5px; }
.rv[disabled] { opacity: .3; cursor: default; }
#riddle { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; padding: 0 4px; }
#riddle .verse { margin: 0; font-style: italic; font-size: 15.5px; line-height: 1.32; max-width: 38ch; text-wrap: balance; }
#riddle .help { margin: 0; font-size: 12.5px; color: var(--vellum-dim); max-width: 44ch; line-height: 1.3; }
#riddle .answered { margin: 0; font-size: 14px; color: var(--vellum-dim); }
#riddle .answered b { color: var(--gilt); font-weight: normal; font-family: var(--font-label); letter-spacing: .06em; }
#guess { display: flex; gap: 6px; width: 100%; max-width: 330px; }
#guess input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--vellum);
  background: var(--lead); border: 1px solid var(--stone-hi); border-radius: 999px; padding: 6px 14px;
}
#guess input:focus { outline: 2px solid var(--gilt); outline-offset: 1px; }
.btn.small { font-size: 14px; padding: 6px 16px; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.overlay h1 { font-family: var(--font-title); font-weight: normal; font-size: 46px; margin: 0; color: var(--gilt); text-wrap: balance; }
.overlay h2 { font-family: var(--font-title); font-weight: normal; font-size: 32px; margin: 0; text-wrap: balance; }
.overlay p { max-width: 34ch; margin: 0; line-height: 1.45; color: var(--vellum-dim); }
.overlay p.inc { font-style: italic; color: var(--vellum); }
.btn {
  font-family: var(--font-label); font-size: 18px; letter-spacing: .08em;
  padding: 11px 26px; border-radius: 999px;
  background: linear-gradient(#e2b453, #a87b27); color: #1a1208;
  box-shadow: 0 2px 0 #5d4214, 0 0 24px #d6a54244;
}
.btn.ghost { background: none; color: var(--vellum); border: 1px solid var(--stone-hi); box-shadow: none; }
.btn:active { transform: translateY(1px); }

#levels-grid {
  display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; justify-content: center;
}
.lv {
  width: 70px; height: 92px; position: relative;
  display: flex; align-items: flex-end; justify-content: center;
}
.lv svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.lv.done span { background: #09080bcc; border-radius: 6px; padding: 0 5px 1px; margin-bottom: 4px; }
.lv span { position: relative; font-family: var(--font-label); font-size: 15px; padding-bottom: 8px; text-shadow: 0 1px 2px #000; }
.lv[disabled] { opacity: .3; cursor: default; }
.levels-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.howto { text-align: left; max-width: 36ch; display: grid; gap: 10px; font-size: 15px; line-height: 1.4; }
.howto div { color: var(--vellum-dim); }
.howto b { color: var(--vellum); font-weight: normal; font-family: var(--font-label); }

.toast {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
  background: #1b1621f2; border: 1px solid var(--stone-hi); border-radius: 999px;
  padding: 6px 14px; font-size: 14px; font-style: italic; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .25s;
}
.toast.show { opacity: 1; }

@media (max-height: 640px) {
  .lore { font-size: 13px; min-height: 2.4em; }
  .gem { height: 50px; } .gem svg { width: 26px; height: 28px; }
  .hour { padding: 3px 4px 4px; }
}
/* Workshop palette and zoom */
#tray.palette { justify-content: flex-start; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; scrollbar-width: none; }
#tray.palette::-webkit-scrollbar { display: none; }
.swatch { flex: none; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px; border-radius: 10px; border: 1px solid transparent; scroll-snap-align: center; }
.swatch .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: Georgia, serif; font-weight: bold; font-size: 14px; border: 2px solid var(--lead); box-shadow: inset 0 -4px 8px #0006, inset 0 3px 6px #fff4; }
.swatch .gn { font-family: var(--font-label); font-size: 11px; color: var(--vellum-dim); }
.swatch .left { font-size: 10.5px; color: var(--vellum-dim); font-variant-numeric: tabular-nums; }
.swatch.sel { border-color: var(--gilt); background: #2f2618; }
.swatch.sel .gn { color: var(--vellum); }
.swatch.done { opacity: .45; }
#zoom-ctl { position: absolute; right: 4px; bottom: 6px; display: flex; flex-direction: column; gap: 8px; }
#zoom-ctl .icon-btn { font-size: 22px; line-height: 1; background: #1b1621e6; }
#scene.panzoom { cursor: grab; }
.found { animation: found 1.4s ease-out 2; }
@keyframes found { 0%, 100% { stroke: #09080b; stroke-width: 1.3; } 40% { stroke: #fff3c4; stroke-width: 4; } }
.mlv { width: 64px; height: 64px; position: relative; display: grid; place-items: center; }
.mlv svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mlv span { position: relative; font-family: var(--font-label); font-size: 15px; text-shadow: 0 1px 2px #000; }
.mlv[disabled] { opacity: .3; cursor: default; }
#mirror-grid { display: grid; grid-template-columns: repeat(3, 64px); gap: 14px; justify-content: center; }
#paint-list { display: grid; gap: 12px; width: 100%; max-width: 340px; }
.pcard { display: flex; gap: 12px; align-items: center; text-align: left; padding: 8px; border-radius: 12px; border: 1px solid var(--stone-hi); background: var(--stone); }
.pcard svg, .pcard img { width: 76px; height: 76px; flex: none; object-fit: contain; }
#paint-list h3 { margin: 6px 0 -4px; }
.pcard b { display: block; font-family: var(--font-label); font-weight: normal; font-size: 17px; color: var(--vellum); }
.pcard small { display: block; color: var(--vellum-dim); font-size: 13.5px; font-style: italic; }
.pcard .bar { height: 5px; border-radius: 3px; background: var(--lead); margin-top: 6px; overflow: hidden; }
.pcard .bar i { display: block; height: 100%; background: var(--gilt); }

/* The nave */
.home { position: fixed; inset: 0; z-index: 10; background: #0b090e; overflow: hidden; animation: fadein .5s; }
#home-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: transform .62s cubic-bezier(.5, 0, .7, .4), opacity .62s; }
#home-svg.zoom { transform: scale(2.6); opacity: 0; }
.home-top, .home-bottom { position: absolute; left: 0; right: 0; text-align: center; transition: opacity .3s;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.home-top { top: 0; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
.home-top h1 { font-family: var(--font-title); font-weight: normal; font-size: 54px; line-height: 1; margin: 0; color: var(--gilt); text-shadow: 0 2px 18px #000; }
.home-top p { margin: 4px 0 0; font-family: var(--font-label); letter-spacing: .2em; font-size: 13px; color: var(--vellum-dim); text-transform: uppercase; }
.home-bottom { bottom: 0; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; justify-content: center; }
.home-bottom .btn { pointer-events: auto; background: #110e16cc; font-size: 15px; padding: 9px 18px; }
.hwin { cursor: pointer; transition: filter .3s; }
.hwin:hover, .hwin:focus-visible { filter: brightness(1.18); outline: none; }
.hwin.chosen { filter: brightness(1.6) drop-shadow(0 0 12px #ffe7a0); }
.hwin.soon { cursor: default; }
.shaft { animation: shaft 7s ease-in-out infinite alternate; }
@keyframes shaft { from { opacity: .7; } to { opacity: 1; } }
.breathe { animation: shaft 5s ease-in-out infinite alternate; }
.mote { opacity: 0; animation: mote 9s linear infinite; }
@keyframes mote { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: .8; } 100% { opacity: 0; transform: translateY(-120px); } }

/* Masterwork reveal */
.mw { animation: glassIn .7s ease-out both; }
@keyframes glassIn { from { opacity: 0; } }
.mw-flash { opacity: 0; animation: mwflash 1.6s ease-out 1.5s both; }
@keyframes mwflash { 0% { opacity: 0; } 25% { opacity: .6; } 100% { opacity: 0; } }
.twinkle { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite both; }
@keyframes twinkle { 0%, 70%, 100% { opacity: 0; transform: scale(.2); } 85% { opacity: 1; transform: scale(1); } }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 26px max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(#110e1600, #110e16 30px);
  animation: sheetIn .45s ease-out;
}
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } }
.sheet h1 { font-family: var(--font-title); font-weight: normal; font-size: 40px; margin: 0; color: var(--gilt); line-height: 1; }
.sheet h2 { font-family: var(--font-label); font-weight: normal; font-size: 17px; letter-spacing: .08em; margin: 0; }
.sheet p { margin: 0; max-width: 34ch; color: var(--vellum-dim); font-size: 14.5px; }
.sheet p.inc { font-style: italic; color: var(--vellum); }

@media (prefers-reduced-motion: reduce) {
  .overlay, .gem.flash, .sheet, .mw, .mw-flash { animation: none; }
  .mw-flash { opacity: 0; }
  .twinkle { animation: none; opacity: .7; }
  .home, .shaft, .breathe { animation: none; }
  .mote { animation: none; opacity: .5; }
  #home-svg { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="btn-menu" aria-label="Windows">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 21V10a7 7 0 0 1 14 0v11z"/><path d="M12 3v18M5 13h14"/></svg>
    </button>
    <div class="title-block"><div class="num" id="lv-num">WINDOW I</div><div class="name" id="lv-name">Lumen</div></div>
    <button class="icon-btn" id="btn-hint" aria-label="Hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c-2 3-5 5-5 9a5 5 0 0 0 10 0c0-4-3-6-5-9z"/><path d="M12 17v-3"/></svg>
    </button>
    <button class="icon-btn" id="btn-reset" aria-label="Clear the window">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg>
    </button>
  </header>
  <div id="scene-wrap">
    <svg id="scene" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stained glass window and the cathedral floor"></svg>
    <div class="toast" id="toast"></div>
    <div id="zoom-ctl" hidden>
      <button class="icon-btn" id="z-in" aria-label="Zoom in">+</button>
      <button class="icon-btn" id="z-out" aria-label="Zoom out">&minus;</button>
    </div>
  </div>
  <div class="lore" id="lore"></div>
  <div id="riddle" hidden></div>
  <div id="hours"></div>
  <div id="tray"></div>
</div>
<div id="overlay-root"></div>

<script>
// ENGINE START ---------------------------------------------------------------
// The window is W lancets wide and H tiers tall. Row 0 is the top tier.
// Sunlight through pane (c, r) lands on the floor at c + shift * (H - r):
// higher panes throw their light further. Shifts per canonical hour:
const HOURS = {
  L: { key: 'L', name: 'Lauds',   sub: 'dawn', shift: 1 },
  S: { key: 'S', name: 'Sext',    sub: 'noon', shift: 0 },
  V: { key: 'V', name: 'Vespers', sub: 'dusk', shift: -1 },
};
const HOUR_ORDER = ['L', 'S', 'V'];

// Glass. mask = primaries it tints with (R=1, Y=2, B=4); lead blocks light.
const PIECES = {
  R: { name: 'Ruby',   mask: 1 },
  Y: { name: 'Gold',   mask: 2 },
  B: { name: 'Cobalt', mask: 4 },
  C: { name: 'Clear',  mask: 0 },
  L: { name: 'Lead',   mask: -1 },
};
const PIECE_ORDER = ['R', 'Y', 'B', 'C', 'L'];
// Light falling on a stone: union of primaries, or D for shadow.
const MASK_TO_LIGHT = ['W', 'R', 'Y', 'O', 'B', 'P', 'G', 'K'];
const LIGHT_NAMES = { W: 'white', R: 'ruby', Y: 'gold', O: 'amber', B: 'blue', P: 'violet', G: 'green', K: 'umber', D: 'shadow' };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function floorWidth(W, H) { return W + 2 * H; }
function landing(W, H, idx, hour) {
  const c = idx % W, r = Math.floor(idx / W);
  return c + HOURS[hour].shift * (H - r) + H;
}
// For each hour, the panes that feed each floor stone.
function feeders(W, H, hour) {
  const out = Array.from({ length: floorWidth(W, H) }, () => []);
  for (let i = 0; i < W * H; i++) out[landing(W, H, i, hour)].push(i);
  return out;
}
function lightFrom(panes, board) {
  let lit = false, mask = 0;
  for (const i of panes) {
    const p = board[i];
    if (!p || p === 'L') continue;
    lit = true; mask |= PIECES[p].mask;
  }
  return lit ? MASK_TO_LIGHT[mask] : 'D';
}
function floorLight(level, board, hour) {
  return feeders(level.W, level.H, hour).map(f => lightFrom(f, board));
}
function targetMet(level, board, t) {
  return lightFrom(feeders(level.W, level.H, t.hour)[t.tile], board) === t.color;
}

// Count arrangements of the inventory into the free panes that satisfy all
// targets, stopping at `limit`.
function countSolutions(W, H, targets, fixed, inv, limit) {
  const n = W * H;
  const board = new Array(n).fill(null);
  const free = [];
  for (let i = 0; i < n; i++) { if (fixed[i]) board[i] = fixed[i]; else free.push(i); }
  const pos = new Array(n).fill(-1);
  free.forEach((i, k) => pos[i] = k);
  const fmap = {};
  for (const h of HOUR_ORDER) fmap[h] = feeders(W, H, h);
  const checkAt = Array.from({ length: free.length }, () => []);
  for (const t of targets) {
    const panes = fmap[t.hour][t.tile];
    let last = -1;
    for (const i of panes) last = Math.max(last, pos[i]);
    if (last < 0) { if (lightFrom(panes, board) !== t.color) return 0; }
    else checkAt[last].push({ panes, color: t.color });
  }
  const counts = { ...inv };
  const types = Object.keys(counts);
  let found = 0;
  function rec(k) {
    if (k === free.length) { found++; return found >= limit; }
    const i = free[k];
    for (const ty of types) {
      if (!counts[ty]) continue;
      counts[ty]--; board[i] = ty;
      let ok = true;
      for (const c of checkAt[k]) if (lightFrom(c.panes, board) !== c.color) { ok = false; break; }
      if (ok && rec(k + 1)) { counts[ty]++; board[i] = null; return true; }
      counts[ty]++;
    }
    board[i] = null;
    return false;
  }
  rec(0);
  return found;
}

// Build a puzzle: pick a hidden window, then reveal the fewest floor

    locked: lv.fixed.map(Boolean),

    sel: lv.palette.find(p => lv.inventory[p] > 0),
    hour: lv.hours[0],
    s: HOURS[lv.hours[0]].shift,
    won: false, hints: 0, peek: null, master: false,
  };
  if (restore && restore.id === id) {
    G.board = restore.board; G.locked = restore.locked; G.inv = restore.inv; G.hour = restore.hour;
    G.s = HOURS[G.hour].shift; G.sel = restore.sel;
  }
  buildScene();
  renderUI();
  draw();
}

// ---------------------------------------------------------------- geometry
let GEO = null;
function computeGeo(lv) {
  const { W, H } = lv;
  const gap = 10;
  const lw = Math.min(62, (300 - (W - 1) * gap) / W);
  const total = W * lw + (W - 1) * gap;
  const x0 = 200 - total / 2;
  const ah = lw * 0.8;           // pointed arch height
  const ph = H === 1 ? 118 : 76; // pane height
  const roseR = Math.min(44, total / 2 - 6);
  const roseCy = 22 + roseR;
  const archTop = roseCy + roseR + 14;
  const paneTop = archTop + ah;
  const sill = paneTop + H * ph;
  const N = floorWidth(W, H);
  const FT = sill + 64, FB = FT + 92;
  const topW = 300, botW = 392;
  return { W, H, gap, lw, total, x0, ah, ph, roseR, roseCy, archTop, paneTop, sill, N, FT, FB,
    ftl: 200 - topW / 2, fbl: 200 - botW / 2, twT: topW / N, twB: botW / N, VH: FB + 16 };
}
function paneRect(i) {
  const c = i % GEO.W, r = Math.floor(i / GEO.W);
  const x = GEO.x0 + c * (GEO.lw + GEO.gap);
  const y = GEO.paneTop + r * GEO.ph;
  return { c, r, x, y, w: GEO.lw, h: GEO.ph };
}
function panePath(i) {
  const { r, x, y, w, h } = paneRect(i);
  if (r === 0) {
    const ah = GEO.ah, xm = x + w / 2;
    return `M${x},${y + h}L${x},${y}Q${x},${y - ah * .55} ${xm},${y - ah}Q${x + w},${y - ah * .55} ${x + w},${y}L${x + w},${y + h}Z`;
  }
  return `M${x},${y}h${w}v${h}h${-w}Z`;
}
function tileQuad(f) { // f may be fractional
  const a = GEO.ftl + f * GEO.twT, b = a + GEO.twT;
  const c = GEO.fbl + f * GEO.twB, d = c + GEO.twB;
  return [[a, GEO.FT], [b, GEO.FT], [d, GEO.FB], [c, GEO.FB]];
}
const pts = q => q.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');

// ---------------------------------------------------------------- scene
const scene = $('#scene');
let layers = {};
function el(tag, attrs, parent) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function buildScene() {
  GEO = computeGeo(G.lv);
  scene.setAttribute('viewBox', `0 0 400 ${GEO.VH.toFixed(0)}`);
  scene.innerHTML = '';
  const defs = el('defs', {}, scene);
  defs.innerHTML = `
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1520"/><stop offset=".7" stop-color="#14111a"/><stop offset="1" stop-color="#0d0b11"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e0c12"/><stop offset=".45" stop-color="#2b2532"/><stop offset="1" stop-color="#0e0c12"/>
    </linearGradient>
    <linearGradient id="floorg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1922"/><stop offset="1" stop-color="#2a2430"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </radialGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#2c2b31"/><path d="M0 0v6" stroke="#46454d" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    ${Object.keys(GLASS).filter(k => GLASS[k].beam).map(k => `
    <linearGradient id="beam-${k}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${GLASS[k].beam}" stop-opacity=".42"/><stop offset="1" stop-color="${GLASS[k].beam}" stop-opacity=".1"/>
    </linearGradient>`).join('')}
  `;
  // Wall and sky tint
  el('rect', { x: 0, y: 0, width: 400, height: GEO.VH, fill: 'url(#wall)' }, scene);
  layers.sky = el('rect', { x: 0, y: 0, width: 400, height: GEO.sill + 20, fill: '#ffd9a0', opacity: .05 }, scene);
  // Pillars
  el('rect', { x: 0, y: 0, width: 26, height: GEO.FT, fill: 'url(#pillar)' }, scene);
  el('rect', { x: 374, y: 0, width: 26, height: GEO.FT, fill: 'url(#pillar)' }, scene);
  // Window recess (outer arch)
  const pad = 14, ox = GEO.x0 - pad, ow = GEO.total + pad * 2, oTop = GEO.roseCy - GEO.roseR - 14;
  el('path', { d: `M${ox},${GEO.sill + 8}L${ox},${GEO.paneTop - 10}Q${ox},${oTop + 10} ${200},${oTop - 8}Q${ox + ow},${oTop + 10} ${ox + ow},${GEO.paneTop - 10}L${ox + ow},${GEO.sill + 8}Z`,
    fill: '#08070a', stroke: '#3a3342', 'stroke-width': 3 }, scene);
  // Sill
  el('rect', { x: ox - 8, y: GEO.sill + 6, width: ow + 16, height: 9, rx: 2, fill: '#3a3342' }, scene);

  // Sun dial (sky arc, top right corner)
  layers.dial = el('g', { transform: 'translate(365,26)' }, scene);
  el('path', { d: 'M-18,8A18,18 0 0 1 18,8', fill: 'none', stroke: '#5b5163', 'stroke-width': 1.2, 'stroke-dasharray': '2 3' }, layers.dial);
  el('line', { x1: -24, y1: 8, x2: 24, y2: 8, stroke: '#5b5163', 'stroke-width': 1 }, layers.dial);
  layers.sun = el('circle', { r: 4.5, fill: '#ffd36b' }, layers.dial);

  layers.rose = el('g', {}, scene);
  layers.glass = el('g', {}, scene);
  layers.master = el('g', {}, scene);
  layers.floor = el('g', {}, scene);
  layers.floorLit = el('g', {}, scene);
  layers.beams = el('g', { style: 'mix-blend-mode:screen', 'pointer-events': 'none' }, scene);
  layers.badges = el('g', { 'pointer-events': 'none' }, scene);
  layers.hits = el('g', {}, scene);

  drawRose();
  drawFloorBase();
  // Hit areas
  for (let i = 0; i < G.lv.W * G.lv.H; i++) {
    const p = el('path', { d: panePath(i), fill: 'transparent', class: 'pane-hit', 'data-pane': i }, layers.hits);
  }
  for (let f = 0; f < GEO.N; f++) {
    el('polygon', { points: pts(tileQuad(f)), fill: 'transparent', class: 'tile-hit', 'data-tile': f }, layers.hits);
  }
}

function drawRose() {
  const g = layers.rose; g.innerHTML = '';
  const cx = 200, cy = GEO.roseCy, R = GEO.roseR;
  el('circle', { cx, cy, r: R + 3, fill: '#09080b', stroke: '#3a3342', 'stroke-width': 3 }, g);
  // Petals take their colours from the solved window, otherwise dim.
  const sol = G.won ? G.board.filter(p => p && p !== 'L') : [];
  const petals = 8;
  for (let k = 0; k < petals; k++) {
    const a = (k / petals) * Math.PI * 2 - Math.PI / 2;
    const px = cx + Math.cos(a) * R * .58, py = cy + Math.sin(a) * R * .58;
    const col = sol.length ? GLASS[sol[k % sol.length]].base : '#2a2531';
    el('circle', { cx: px.toFixed(1), cy: py.toFixed(1), r: (R * .33).toFixed(1), fill: col, stroke: '#09080b', 'stroke-width': 2.5 }, g);
  }
  el('circle', { cx, cy, r: R * .26, fill: sol.length ? '#ffd76a' : '#332d3a', stroke: '#09080b', 'stroke-width': 2.5 }, g);
  if (sol.length) el('circle', { cx, cy, r: R, fill: '#ffd76a', opacity: .18, filter: 'url(#glow)' }, g);
}

// ---------------------------------------------------------------- masterwork
// The reward: once solved, the plain panes are re-leaded into a full
// figurative window, coloured by the glass the player set.
const RICH = { R: '#a50f2a', Y: '#e0a21b', B: '#173f9e', O: '#d9661a', G: '#1f7a45', P: '#5e2a8c', W: '#e6dfc0', K: '#7a4a22', D: '#1a1440' };
const GILT = '#e8c25a', PEARL = '#f3ecd2', CAME = '#09080b';
const richCode = p => p === 'C' ? 'W' : p === 'L' ? 'D' : p;
function rgbOf(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(h, t) {
  const a = rgbOf(h), to = t < 0 ? 0 : 255, k = Math.abs(t);
  return '#' + a.map(v => Math.round(v + (to - v) * k).toString(16).padStart(2, '0')).join('');
}
function lancetD(x, w, tip, base, bot) {
  const xm = x + w / 2, ah = base - tip;
  return `M${x},${bot}L${x},${base}Q${x},${base - ah * .55} ${xm},${tip}Q${x + w},${base - ah * .55} ${x + w},${base}L${x + w},${bot}Z`;
}
const polar = (cx, cy, r, a) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
const fx = p => p.map(v => v.toFixed(2)).join(',');

// Motifs live in a unit circle; c = { p: main, s: ring, g: gilt, w: pearl }.
const MOTIFS = [
  function fleur(m, c) {
    m('path', { d: 'M0,-1C0.32,-0.62 0.3,-0.18 0,0.22C-0.3,-0.18 -0.32,-0.62 0,-1Z' }, c.p);
    const side = 'M0.12,0.12C0.3,-0.45 0.95,-0.42 0.85,0.05C0.8,0.28 0.55,0.25 0.5,0.1C0.62,0.08 0.66,-0.08 0.55,-0.12C0.4,-0.12 0.3,0.05 0.28,0.22Z';
    m('path', { d: side }, c.p);
    m('path', { d: side, transform: 'scale(-1,1)' }, c.p);
    m('path', { d: 'M-0.22,0.35L0.22,0.35L0,0.85Z' }, c.p);
    m('rect', { x: -0.5, y: 0.17, width: 1, height: 0.18 }, c.g);
  },
  function star(m, c) {
    const p = [];
    for (let k = 0; k < 16; k++) p.push(fx(polar(0, 0, k % 2 ? .42 : 1, k * Math.PI / 8 - Math.PI / 2)));
    m('polygon', { points: p.join(' ') }, c.g);
    m('circle', { r: .27 }, c.p);
  },
  function flower(m, c) {
    for (let k = 0; k < 6; k++) { const [x, y] = polar(0, 0, .52, k * Math.PI / 3); m('circle', { cx: x, cy: y, r: .34 }, c.p); }
    m('circle', { r: .3 }, c.g);
  },
  function cross(m, c) {
    for (const [x, y] of [[0, -.8], [0, .8], [-.8, 0], [.8, 0]]) m('circle', { cx: x, cy: y, r: .18 }, c.g);
    m('path', { d: 'M-0.15,-0.75h0.3v1.5h-0.3z' }, c.p);
    m('path', { d: 'M-0.75,-0.15v0.3h1.5v-0.3z' }, c.p);
    m('path', { d: 'M0,-0.3L0.3,0L0,0.3L-0.3,0Z' }, c.g);
  },
  function sun(m, c) {
    for (let k = 0; k < 12; k++) {
      const a = k * Math.PI / 6;
      m('polygon', { points: [polar(0, 0, .42, a - .17), polar(0, 0, 1, a), polar(0, 0, .42, a + .17)].map(fx).join(' ') }, k % 2 ? c.p : c.g);
    }
    m('circle', { r: .45 }, c.g);
    m('circle', { r: .26 }, c.w);
  },
  function chalice(m, c) {
    for (let k = 0; k < 8; k++) { const a = -Math.PI / 2 + (k - 3.5) * .28; m('polygon', { points: [polar(0, -.8, .22, a - .08), polar(0, -.8, .5, a), polar(0, -.8, .22, a + .08)].map(fx).join(' ') }, c.g); }
    m('circle', { cx: 0, cy: -0.8, r: .2 }, c.w);
    m('path', { d: 'M-0.55,-0.5L0.55,-0.5C0.5,0.05 0.2,0.15 0.08,0.2L0.08,0.55L0.42,0.8L-0.42,0.8L-0.08,0.55L-0.08,0.2C-0.2,0.15 -0.5,0.05 -0.55,-0.5Z' }, c.g);
    m('rect', { x: -0.4, y: -0.35, width: .8, height: .12 }, c.p);
  },
  function dove(m, c) {
    m('circle', { cx: .55, cy: -.12, r: .3 }, c.g);
    m('path', { d: 'M-0.45,0.12L-0.95,-0.12L-0.88,0.34Z' }, c.w);
    m('ellipse', { cx: .02, cy: .1, rx: .58, ry: .23 }, c.w);
    m('path', { d: 'M-0.1,0.02L0.22,-0.85L0.42,0.0Z' }, c.w);
    m('circle', { cx: .55, cy: -.12, r: .16 }, c.w);
    m('path', { d: 'M0.2,0.3Q0.3,0.6 0.1,0.85M0.2,0.55L0.42,0.5M0.18,0.72L-0.02,0.66' , fill: 'none' }, 'none', c.p);
  },
  function tree(m, c) {
    m('path', { d: 'M-0.09,0.88L-0.09,-0.1L0.09,-0.1L0.09,0.88Z' }, c.s);
    m('circle', { cx: -0.42, cy: -0.05, r: .3 }, c.p);
    m('circle', { cx: 0.42, cy: -0.05, r: .3 }, c.p);
    m('circle', { cx: 0, cy: -0.48, r: .4 }, c.p);
    for (const [x, y] of [[-.42, -.05], [.42, -.05], [0, -.55], [-.15, -.35], [.17, -.38]]) m('circle', { cx: x, cy: y, r: .08 }, c.g);
  },
  function moon(m, c) {
    m('path', { d: 'M0.2,-0.85A0.85,0.85 0 1 0 0.2,0.85A0.68,0.68 0 1 1 0.2,-0.85Z' }, c.g);
    for (const [x, y, r] of [[.55, -.35, .12], [.62, .3, .09], [.25, .05, .07]]) {
      const p = [];
      for (let k = 0; k < 8; k++) p.push(fx(polar(x, y, k % 2 ? r * .4 : r, k * Math.PI / 4)));
      m('polygon', { points: p.join(' ') }, c.w);
    }
  },
];

function drawMasterwork(parent, lv, board, geo, pfx, animate) {
  const rng = mulberry32((lv.id + 1) * 7777);
  const { W, H } = lv;
  const top0 = geo.roseCy - geo.roseR, bot0 = geo.sill;
  const root = el('g', {}, parent);
  const defs = el('defs', {}, root);
  // Pieces fill with light from the top of the window downward.
  const P = (tag, attrs, g, y) => {
    const e = el(tag, attrs, g);
    if (animate) { e.classList.add('mw'); e.style.animationDelay = (((y - top0) / (bot0 - top0)) * 1.5 + rng() * .25).toFixed(2) + 's'; }
    return e;
  };
  const lead = (w = 1.2) => ({ stroke: CAME, 'stroke-width': w, 'stroke-linejoin': 'round' });
  const used = [];
  board.forEach(p => { const k = richCode(p); if (!used.includes(k)) used.push(k); });
  for (let c = 0; c < W; c++) { const k = lightFrom([c, (H - 1) * W + c], board); if (!used.includes(k)) used.push(k); }
  const cols = used.map(k => RICH[k]);

  for (let c = 0; c < W; c++) {
    const x = geo.x0 + c * (geo.lw + geo.gap), w = geo.lw;
    const tip = geo.archTop, base = geo.paneTop, bot = geo.sill;
    const topC = richCode(board[c]), btmC = richCode(board[(H - 1) * W + c]);
    const mixC = lightFrom([c, (H - 1) * W + c], board);
    const d = lancetD(x, w, tip, base, bot);
    const clip = el('clipPath', { id: `${pfx}-cl${c}` }, defs);
    el('path', { d }, clip);
    const g = el('g', { 'clip-path': `url(#${pfx}-cl${c})` }, root);

    // Mottled quarries
    const field = shade(RICH[btmC], btmC === 'W' ? -.12 : -.35);
    const dw = w / 3, dh = dw * 1.35;
    for (let j = 0, cy = tip - dh / 2; cy < bot + dh; j++, cy += dh / 2) {
      for (let cx = x + (j % 2 ? 0 : dw / 2) - dw; cx < x + w + dw; cx += dw) {
        P('polygon', { points: `${fx([cx, cy - dh / 2])} ${fx([cx + dw / 2, cy])} ${fx([cx, cy + dh / 2])} ${fx([cx - dw / 2, cy])}`,
          fill: shade(field, (rng() - .5) * .34), ...lead(1) }, g, cy);
      }
    }
    // Jewelled border
    const bd = lancetD(x + 3, w - 6, tip + 5, base, bot - 3);
    P('path', { d: bd, fill: 'none', stroke: shade(RICH[topC], .05), 'stroke-width': 6 }, g, tip);
    P('path', { d: bd, fill: 'none', stroke: GILT, 'stroke-width': 6, 'stroke-dasharray': '4 6' }, g, tip);
    el('path', { d: lancetD(x + 6, w - 12, tip + 10, base, bot - 6), fill: 'none', ...lead(1.2) }, g);

    // Trefoil in the arch head
    const tcx = x + w / 2, tcy = tip + (base - tip) * .68, tr = w * .12;
    for (let k = 0; k < 3; k++) { const [px, py] = polar(tcx, tcy, tr * .85, -Math.PI / 2 + k * 2 * Math.PI / 3); P('circle', { cx: px, cy: py, r: tr, fill: GILT, ...lead() }, g, tcy); }
    P('circle', { cx: tcx, cy: tcy, r: tr * .7, fill: RICH[mixC], ...lead() }, g, tcy);

    // Medallions with figures
    const ph = geo.ph;
    const centres = H === 1 ? [base + ph * .27, base + ph * .73] : [base + ph * .5, base + ph * 1.5];
    const mr = w * .4;
    centres.forEach((cy, k) => {
      const cx = x + w / 2;
      const ringC = k === 0 ? topC : btmC;
      const ring = RICH[ringC];
      const bg = ringC === 'B' || ringC === 'D' ? '#7d0c22' : '#16348a';
      const pc = RICH[mixC] === ring || mixC === 'D' ? GILT : RICH[mixC];
      if ((c + k) % 2 === 0) {
        P('circle', { cx, cy, r: mr, fill: ring, ...lead(1.6) }, g, cy);
        P('circle', { cx, cy, r: mr * .78, fill: bg, ...lead(1.4) }, g, cy);
        for (let q = 0; q < 10; q++) { const [px, py] = polar(cx, cy, mr * .89, q * Math.PI / 5); P('circle', { cx: px, cy: py, r: mr * .065, fill: PEARL, ...lead(.8) }, g, cy); }
      } else {
        const o = mr * .45, rr = mr * .55;
        for (const [ox, oy] of [[o, 0], [-o, 0], [0, o], [0, -o]]) P('circle', { cx: cx + ox, cy: cy + oy, r: rr, fill: ring, ...lead(1.6) }, g, cy);
        for (const [ox, oy] of [[o, 0], [-o, 0], [0, o], [0, -o]]) P('circle', { cx: cx + ox, cy: cy + oy, r: rr * .74, fill: bg }, g, cy);
        P('rect', { x: cx - o, y: cy - o, width: o * 2, height: o * 2, fill: bg }, g, cy);
      }
      const motif = MOTIFS[(lv.id * 3 + c * 2 + k) % MOTIFS.length];
      const mg = el('g', { transform: `translate(${cx.toFixed(1)},${cy.toFixed(1)}) scale(${(mr * .6).toFixed(2)})` }, g);
      const colors = { p: pc, s: shade(ring, .25), g: GILT, w: PEARL };
      motif((tag, attrs, fill, stroke) => P(tag, { fill, ...attrs, stroke: stroke || CAME, 'stroke-width': 1.1, 'vector-effect': 'non-scaling-stroke' }, mg, cy), colors);
    });
    // Donor's band at the foot
    P('rect', { x: x + 6, y: bot - 14, width: w - 12, height: 7, fill: GILT, ...lead(1) }, g, bot);
    for (let q = 1; q < 5; q++) el('line', { x1: x + 6 + (w - 12) * q / 5, y1: bot - 14, x2: x + 6 + (w - 12) * q / 5, y2: bot - 7, ...lead(.8) }, g);
    el('path', { d, fill: 'none', ...lead(3.5) }, root);
  }

  // Roundels in the spandrels between lancet heads
  for (let c = 0; c < W - 1; c++) {
    const cx = geo.x0 + (c + 1) * (geo.lw + geo.gap) - geo.gap / 2, cy = geo.archTop + geo.ah * .3;
    const r = Math.min(11, (geo.gap + .4 * geo.lw) / 2 - 3);
    P('circle', { cx, cy, r, fill: GILT, ...lead(1.6) }, root, cy);
    const p = [];
    for (let k = 0; k < 10; k++) p.push(fx(polar(cx, cy, k % 2 ? r * .35 : r * .75, k * Math.PI / 5 - Math.PI / 2)));
    P('polygon', { points: p.join(' '), fill: cols[c % cols.length], ...lead(1) }, root, cy);
  }

  // The rose
  const cx = 200, cy = geo.roseCy, R = geo.roseR;
  el('circle', { cx, cy, r: R + 3, fill: CAME, stroke: '#3a3342', 'stroke-width': 3 }, root);
  P('circle', { cx, cy, r: R, fill: GILT, ...lead(1.5) }, root, cy - R);
  const seg = 16;
  for (let k = 0; k < seg; k++) {
    const a0 = k * 2 * Math.PI / seg - Math.PI / 2, a1 = a0 + 2 * Math.PI / seg;
    const r0 = R * .8, r1 = R * .97;
    P('path', { d: `M${fx(polar(cx, cy, r1, a0))}A${r1},${r1} 0 0 1 ${fx(polar(cx, cy, r1, a1))}L${fx(polar(cx, cy, r0, a1))}A${r0},${r0} 0 0 0 ${fx(polar(cx, cy, r0, a0))}Z`,
      fill: k % 2 ? cols[(k >> 1) % cols.length] : '#16348a', ...lead(1.1) }, root, cy - R + k);
  }
  P('circle', { cx, cy, r: R * .8, fill: '#120f2a', ...lead(1.2) }, root, cy);
  const pet = 8;
  for (let k = 0; k < pet; k++) {
    const a = k * 2 * Math.PI / pet - Math.PI / 2;
    const p0 = polar(cx, cy, R * .27, a), p1 = polar(cx, cy, R * .78, a);
    const c1 = polar(cx, cy, R * .55, a - .36), c2 = polar(cx, cy, R * .55, a + .36);
    P('path', { d: `M${fx(p0)}Q${fx(c1)} ${fx(p1)}Q${fx(c2)} ${fx(p0)}Z`, fill: cols[k % cols.length], ...lead(1.2) }, root, cy + Math.sin(a) * R * .5);
    const [bx, by] = polar(cx, cy, R * .66, a + Math.PI / pet);
    P('circle', { cx: bx, cy: by, r: R * .08, fill: PEARL, ...lead(.9) }, root, by);
  }
  P('circle', { cx, cy, r: R * .27, fill: '#16348a', ...lead(1.4) }, root, cy);
  const sp = [];
  for (let k = 0; k < 16; k++) sp.push(fx(polar(cx, cy, k % 2 ? R * .1 : R * .22, k * Math.PI / 8)));
  P('polygon', { points: sp.join(' '), fill: GILT, ...lead(1) }, root, cy);
  return root;
}

// Light breaking through the finished glass.
function addGlints(parent, geo, animate) {
  const rng = mulberry32(42);
  if (animate) {
    const fl = el('g', { class: 'mw-flash', style: 'mix-blend-mode:screen', 'pointer-events': 'none' }, parent);
    for (let c = 0; c < geo.W; c++) {

    }
    el('circle', { cx: 200, cy: geo.roseCy, r: geo.roseR, fill: '#fff4d0' }, fl);
  }
  for (let k = 0; k < 7; k++) {
    const x = geo.x0 + rng() * geo.total, y = geo.roseCy - geo.roseR * .6 + rng() * (geo.sill - geo.roseCy);
    const s = 3 + rng() * 3.5;
    const st = el('path', { d: `M${x},${y - s}Q${x},${y} ${x + s},${y}Q${x},${y} ${x},${y + s}Q${x},${y} ${x - s},${y}Q${x},${y} ${x},${y - s}Z`,
      fill: '#fffbe8', class: 'twinkle', 'pointer-events': 'none' }, parent);
    st.style.animationDelay = (2.2 + rng() * 3).toFixed(2) + 's';
  }
}
function masterThumb(id) {
  const lv = getLevel(id), geo = computeGeo(lv);

function drawFloorBase() {
  const g = layers.floor;
  // Nave floor perspective slab
  el('polygon', { points: pts([[GEO.ftl - 20, GEO.FT - 6], [400 - GEO.ftl + 20, GEO.FT - 6], [404, GEO.FB + 8], [-4, GEO.FB + 8]]), fill: '#0d0b10' }, g);
  for (let f = 0; f < GEO.N; f++) {
    el('polygon', { points: pts(tileQuad(f)), fill: 'url(#floorg)', stroke: '#0a090c', 'stroke-width': 2 }, g);
  }

function hourSkyColor(s) {
  // s: +1 dawn, 0 noon, -1 dusk
  const dawn = [255, 170, 160], noon = [255, 236, 190], dusk = [255, 140, 70];
  const t = Math.abs(s), to = s > 0 ? dawn : dusk;
  return noon.map((v, i) => Math.round(v + (to[i] - v) * t));
}

// Draw everything that depends on the board or sun position.
function draw() {
  const { lv, board } = G;
  const { W, H } = lv;
  const s = G.s;
  const atHour = HOUR_ORDER.find(h => Math.abs(HOURS[h].shift - s) < 1e-3 && lv.hours.includes(h));

  const sky = hourSkyColor(s);
  layers.sky.setAttribute('fill', `rgb(${sky})`);
  layers.sun.setAttribute('cx', (-s * 18 * Math.cos(0)).toFixed(1));
  layers.sun.setAttribute('cy', (8 - 18 * Math.sqrt(Math.max(0, 1 - s * s))).toFixed(1));

  // Glass
  const gg = layers.glass; gg.innerHTML = '';
  const peekSet = new Set(G.peek ? G.peek.panes : []);
  for (let i = 0; i < W * H && !G.master; i++) {
    const p = board[i];
    const d = panePath(i);
    if (!p) {
      el('path', { d, fill: '#0f0d13', stroke: '#2c2633', 'stroke-width': 1 }, gg);
      const { x, y, w, h } = paneRect(i);
      el('path', { d: `M${x + w / 2 - 5},${y + h / 2}h10M${x + w / 2},${y + h / 2 - 5}v10`, stroke: '#4a4152', 'stroke-width': 1.2 }, gg);
    } else {
      const gl = GLASS[p];
      el('path', { d, fill: p === 'L' ? 'url(#hatch)' : gl.base }, gg);
      if (p !== 'L') {
        el('path', { d, fill: gl.hi, opacity: .35, filter: 'url(#soft)', transform: '' }, gg);
        el('path', { d, fill: 'url(#sheen)' }, gg);
        // painted grisaille detail: a small roundel with a cross
        const { x, y, w, h } = paneRect(i);
        const cx = x + w / 2, cy = y + h / 2, rr = Math.min(w, h) * .2;
        el('circle', { cx, cy, r: rr, fill: 'none', stroke: '#00000040', 'stroke-width': 1.3 }, gg);
        el('path', { d: `M${cx - rr * .6},${cy}h${rr * 1.2}M${cx},${cy - rr * .6}v${rr * 1.2}`, stroke: '#00000040', 'stroke-width': 1.3 }, gg);
      }
    }
    // Lead came
    el('path', { d, fill: 'none', stroke: '#09080b', 'stroke-width': 3.5, 'stroke-linejoin': 'round' }, gg);
    if (G.locked[i] && !G.won) {
      const { x, y } = paneRect(i);
      el('circle', { cx: x + 7, cy: y + 7, r: 2.6, fill: '#d6a542', stroke: '#09080b', 'stroke-width': 1 }, gg);
    }
    if (peekSet.has(i)) {
      el('path', { d, fill: 'none', stroke: '#fff3c4', 'stroke-width': 2.2, 'stroke-dasharray': '4 3' }, gg);
    }
  }

  // Beams
  const bg = layers.beams; bg.innerHTML = '';
  for (let i = 0; i < W * H; i++) {
    const p = board[i];
    if (!p || p === 'L') continue;
    const { c, r, x, y, w, h } = paneRect(i);
    const f = c + s * (H - r) + H;
    const q = tileQuad(f);
    // Over the finished window, beams leave from the sill so the art stays clear.
    const ys = G.master ? GEO.sill + 6 : y + h - 4;
    const dim = G.peek && !peekSet.has(i) ? .35 : 1;
    el('polygon', { points: pts([[x + 3, ys], [x + w - 3, ys], q[2], q[3]]), fill: `url(#beam-${p})`, opacity: dim }, bg);
  }

  // Floor light: shown only when the sun stands at a canonical hour.
  const fl = layers.floorLit; fl.innerHTML = '';
  const lights = atHour ? floorLight(lv, board, atHour) : null;
  const feeds = atHour ? feeders(W, H, atHour) : null;
  if (lights) {
    lights.forEach((code, f) => {
      if (code === 'D') return;
      const q = pts(tileQuad(f));
      el('polygon', { points: q, fill: LIGHT[code], opacity: .55, filter: 'url(#glow)' }, fl);
      el('polygon', { points: q, fill: LIGHT[code], opacity: .78 }, fl);
    });
  }
  if (G.peek) {
    el('polygon', { points: pts(tileQuad(G.peek.tile)), fill: 'none', stroke: '#fff3c4', 'stroke-width': 2, 'stroke-dasharray': '4 3' }, fl);
  }

  // Requirement marks: one diamond per hour, placed where that hour's sun stands.
  const bgd = layers.badges; bgd.innerHTML = '';
  const slotX = { L: -1, S: 0, V: 1 };
  for (const t of lv.targets) {
    const q = tileQuad(t.tile);
    const midTop = (q[0][0] + q[1][0]) / 2, midBot = (q[2][0] + q[3][0]) / 2;
    const cy = GEO.FT + (GEO.FB - GEO.FT) * .55;
    const cxm = (midTop + midBot) / 2;
    const tw = (GEO.twT + GEO.twB) / 2;
    const spacing = Math.min(14, tw / 3.1);
    const cx = cxm + slotX[t.hour] * spacing;
    const current = t.hour === atHour;
    const met = targetMet(lv, board, t);
    const rad = current ? Math.min(7.5, spacing * .55) : Math.min(5.5, spacing * .42);
    const g = el('g', { transform: `translate(${cx.toFixed(1)},${cy.toFixed(1)})`, opacity: current || G.won ? 1 : .55 }, bgd);
    const dia = `M0,${-rad * 1.25}L${rad},0L0,${rad * 1.25}L${-rad},0Z`;
    if (current) el('path', { d: dia, fill: '#000', opacity: .6, transform: 'scale(1.45)' }, g);
    el('path', { d: dia, fill: LIGHT[t.color], stroke: met ? '#ffe9a8' : '#09080b', 'stroke-width': met ? 2 : 1.5 }, g);
    if (t.color === 'D') el('path', { d: `M${rad * .15},${-rad * .55}a${rad * .5},${rad * .5} 0 1 0 0,${rad * 1.1}a${rad * .38},${rad * .38} 0 1 1 0,${-rad * 1.1}`, fill: '#cfc6e0' }, g);
    if (met && current) el('path', { d: `M${-rad * .9},${rad * 2.1}l${rad * .55},${rad * .5}l${rad * 1.1},${-rad * .9}`, fill: 'none', stroke: '#ffe9a8', 'stroke-width': 1.6, 'stroke-linecap': 'round' }, g);
  }
}

// ---------------------------------------------------------------- UI

function hourStats(h) {
  const ts = G.lv.targets.filter(t => t.hour === h);
  return { total: ts.length, met: ts.filter(t => targetMet(G.lv, G.board, t)).length };
}

function renderUI() {
  const { lv } = G;
  const isPil = G.id >= CAMPAIGN.length;
  $('#lv-num').textContent = isPil ? 'THE PILGRIM ROAD' : 'WINDOW ' + toRoman(G.id + 1) + ' OF ' + toRoman(CAMPAIGN.length);
  $('#lv-name').textContent = lv.name;

}
function renderHours() {
  const box = $('#hours'); box.innerHTML = '';
  for (const h of G.lv.hours) {
    const st = hourStats(h);
    const b = document.createElement('button');
    b.className = 'hour' + (G.hour === h ? ' on' : '') + (st.met === st.total && st.total ? ' done' : '');
    b.innerHTML = `${sunIcon(h, G.hour === h)}<span class="hn">${HOURS[h].name}</span><span class="hs">${st.total ? `${st.met} of ${st.total} lit` : 'no marks'}</span>`;
    b.setAttribute('aria-pressed', G.hour === h);
    b.onclick = () => setHour(h);
    box.appendChild(b);
  }
}
function renderTray() {
  const box = $('#tray'); box.innerHTML = '';
  for (const p of G.lv.palette) {
    const b = document.createElement('button');
    const n = G.inv[p] || 0;
    b.className = 'gem' + (G.sel === p ? ' sel' : '') + (n ? '' : ' empty');
    b.dataset.piece = p;
    b.innerHTML = `${gemIcon(p)}<span class="gn">${PIECES[p].name}</span><span class="ct">${n}</span>`;
    b.setAttribute('aria-label', `${PIECES[p].name} glass, ${n} left`);
    b.onclick = () => { G.sel = p; sfx.tick(p); renderTray(); };
    box.appendChild(b);
  }
}
function flashGem(p) {
  const b = document.querySelector(`.gem[data-piece="${p}"]`);
  if (!b) return;
  b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------------------------------------------------------------- sun motion
let anim = null;
function animateSun(to, dur, done) {
  cancelAnimationFrame(anim);
  const from = G.s, t0 = performance.now();
  if (reduceMotion || from === to) { G.s = to; draw(); done && done(); return; }
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    G.s = from + (to - from) * e;
    draw();
    if (k < 1) anim = requestAnimationFrame(step); else { G.s = to; draw(); done && done(); }
  };
  anim = requestAnimationFrame(step);
}
function setHour(h) {
  if (G.won || G.hour === h) return;
  G.hour = h; G.peek = null;
  sfx.bell(h);
  renderHours();
  animateSun(HOURS[h].shift, 650 * Math.abs(HOURS[h].shift - G.s) + 200);
}

// ---------------------------------------------------------------- input
scene.addEventListener('click', e => {
  if (MODE !== 'light') return;
  if (G && G.won && !G.winShown) { showWin(); return; }
  if (!G || G.won) return;
  const pe = e.target.closest('[data-pane]');
  const te = e.target.closest('[data-tile]');
  if (pe) tapPane(+pe.dataset.pane);
  else if (te) tapTile(+te.dataset.tile);
});
function tapPane(i) {
  if (G.master) return;
  G.peek = null;
  if (G.locked[i]) { toast('This pane is old glass, set long ago.'); return; }
  const cur = G.board[i];
  if (cur) {
    G.inv[cur]++;
    G.board[i] = null;
    if (cur !== G.sel && G.inv[G.sel] > 0) { G.board[i] = G.sel; G.inv[G.sel]--; sfx.tick(G.sel); }
    else sfx.lift();
  } else {
    if (!G.sel || !G.inv[G.sel]) {
      const any = G.lv.palette.find(p => G.inv[p] > 0);
      if (G.sel) flashGem(G.sel);
      if (!any) return;
      toast(`No ${PIECES[G.sel].name.toLowerCase()} left. Tap a pane to take its glass back.`);
      return;
    }
    G.board[i] = G.sel; G.inv[G.sel]--;
    sfx.tick(G.sel);
    if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
  }
  if (!G.inv[G.sel]) { const nx = G.lv.palette.find(p => G.inv[p] > 0); if (nx) G.sel = nx; }
  renderTray(); renderHours(); draw();
  checkWin();
}
let peekTimer;
function tapTile(f) {
  const h = HOUR_ORDER.find(k => Math.abs(HOURS[k].shift - G.s) < 1e-3);
  if (!h) return;
  const panes = feeders(G.lv.W, G.lv.H, h)[f];
  G.peek = { tile: f, panes };
  const marks = G.lv.targets.filter(t => t.tile === f);
  if (!panes.length) toast(`No window light reaches this stone at ${HOURS[h].name}.`);
  else if (marks.length) toast(marks.map(t => `${HOURS[t.hour].name}: ${LIGHT_NAMES[t.color]}`).join(' · '));
  draw();
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => { if (G.peek && G.peek.tile === f) { G.peek = null; draw(); } }, 2200);
}

function checkWin() {
  const { lv, board } = G;
  if (board.some(p => !p)) return;
  const bad = lv.targets.filter(t => !targetMet(lv, board, t));
  if (bad.length) {
    const h = bad[0].hour;
    toast(`The window is full, but ${bad.length} mark${bad.length > 1 ? 's are' : ' is'} still wrong.` + (G.hour !== h ? ` Check ${HOURS[h].name}.` : ''));
    return;
  }
  G.won = true;
  save.solved[G.id] = Math.min(save.solved[G.id] ?? 99, G.hints);
  if (G.id < CAMPAIGN.length) save.unlocked = Math.max(save.unlocked, G.id + 1);
  else save.pilgrim = Math.max(save.pilgrim, G.id - CAMPAIGN.length + 1);
  persist();
  sfx.win();
  revealMasterwork(true);
  draw();
  // Let the new glass fill with light, then walk the sun across the day.
  const seq = [1, 0, -1];
  let k = 0;
  const id = G.id;
  const next = () => {
    if (G.id !== id || G.winShown) return;
    if (k >= seq.length) { G.winTimer = setTimeout(showWin, 300); return; }
    const to = seq[k++];
    animateSun(to, 850, () => { G.winTimer = setTimeout(next, 300); });
  };
  G.winTimer = setTimeout(next, reduceMotion ? 200 : 2600);
}
function revealMasterwork(animate) {
  G.master = true;
  layers.rose.innerHTML = '';
  layers.glass.innerHTML = '';
  layers.master.innerHTML = '';
  drawMasterwork(layers.master, G.lv, G.board, GEO, 'mw', animate && !reduceMotion);
  addGlints(layers.master, GEO, animate && !reduceMotion);
}

function hint() {
  if (!G || G.won) return;
  const { lv } = G;
  const wrong = [];
  for (let i = 0; i < lv.W * lv.H; i++) if (!G.locked[i] && G.board[i] !== lv.solution[i]) wrong.push(i);
  if (!wrong.length) return;
  const i = wrong[Math.floor(Math.random() * wrong.length)];
  const want = lv.solution[i];
  if (G.board[i]) { G.inv[G.board[i]]++; G.board[i] = null; }
  if (!G.inv[want]) {
    // Pull the needed glass out of a pane where it doesn't belong.
    const j = wrong.find(k => k !== i && G.board[k] === want);
    G.board[j] = null; G.inv[want]++;
  }
  G.board[i] = want; G.inv[want]--; G.locked[i] = true;
  G.hints++;
  sfx.bell('S');
  toast(`A pane of ${PIECES[want].name.toLowerCase()} is set and sealed.`);
  renderTray(); renderHours(); draw();
  checkWin();
}

// ---------------------------------------------------------------- overlays
const ov = $('#overlay-root');
function closeOverlay() { ov.innerHTML = ''; }
function showWin() {
  if (G.winShown) return;
  G.winShown = true;
  clearTimeout(G.winTimer);
  const next = G.id + 1;
  const isLast = G.id === CAMPAIGN.length - 1;

  ov.innerHTML = `<div class="sheet">
    <h1>Consecrated</h1>
    <h2>${G.lv.name}</h2>

    ${G.hints ? `<p>${G.hints} pane${G.hints > 1 ? 's' : ''} set by the master glazier.</p>` : ''}
    <div class="levels-actions">
      <button class="btn" id="ov-next">${isLast ? 'Walk the pilgrim road' : next >= CAMPAIGN.length ? 'Next parish' : 'Next window'}</button>
      <button class="btn ghost" id="ov-stay">Admire it</button>
    </div></div>`;
  $('#ov-next').onclick = () => { closeOverlay(); startLevel(next); };

function admire() {
  // Allow scrolling the hours over the finished glass.
  G.won = false; G.locked = G.locked.map(() => true); G.admiring = true;
  $('#lore').innerHTML = '<span>Your window, finished and leaded. Switch hours to watch the light, or open the windows list to move on.</span>';
  renderHours(); draw();
}
// ---------------------------------------------------------------- the nave (home)
// The game opens in the cathedral. Each great window leads to one game.
function fitInto(g, box, slot) {
  const s = Math.min(slot.w / box.w, slot.h / box.h);
  const tx = slot.x + slot.w / 2 - (box.x + box.w / 2) * s;
  const ty = slot.y + slot.h - (box.y + box.h) * s;
  g.setAttribute('transform', `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${s.toFixed(4)})`);
}
function archD(x, y, w, h, rise) {
  return `M${x},${y + h}L${x},${y + rise}Q${x},${y + rise * .25} ${x + w / 2},${y}Q${x + w},${y + rise * .25} ${x + w},${y + rise}L${x + w},${y + h}Z`;
}
const HOME_MOON = { id: 50, answers: [''], art: ['.......', '..YYY..', '.YY..W.', '.Y.....', '.Y..W..', '.Y.....', '.YY..W.', '..YYY..', '.......'] };

function showHome() {
  const lightDone = Object.keys(save.solved).filter(k => +k < CAMPAIGN.length).length;
  const riddleDone = RIDDLES.filter((r, i) => save.riddles[i] && save.riddles[i].solved).length;
  const mirrorDone = MIRROR_LEVELS.filter((m, i) => save.mirror[i]).length;
  let paintDone = 0;

const RNAME = { R: 'Ruby', Y: 'Gold', O: 'Amber', G: 'Green', B: 'Cobalt', P: 'Violet', W: 'Pearl', K: 'Jet', '.': 'Plain' };
const riddleCache = {};
function getRiddle(id) { return riddleCache[id] || (riddleCache[id] = buildRiddle(id)); }
let RG = null;  // the riddle being played
let RGEO = null;
const rLayers = {};

function riddleGeo(rd) {
  const { W, H } = rd;
  const cs = Math.min(34, 290 / W, 300 / H);
  const gw = W * cs, gh = H * cs, gx = 200 - gw / 2;
  const archH = gw * .42, top = 14;
  const gy = top + archH + 4;
  const sill = gy + gh;
  let maxChips = 1;
  for (const h of HOUR_ORDER) for (const cl of rd.clues[h]) maxChips = Math.max(maxChips, Object.keys(cl).filter(k => k !== RIDDLE_BG).length);
  const nd = W + H - 1;
  const chipR = Math.min(8.5, (380 / nd) * .38);
  const FT = sill + 52;
  const FB = FT + 16 + maxChips * (2 * chipR + 3);
  return { W, H, cs, gw, gh, gx, gy, archH, top, sill, chipR, FT, FB, VH: FB + 10 };
}
function stoneQuad(k, n) {
  const g = RGEO, tl = 22, tw = 356 / n, bl = 4, bw = 392 / n;
  return [[tl + k * tw, g.FT], [tl + (k + 1) * tw, g.FT], [bl + (k + 1) * bw, g.FB], [bl + k * bw, g.FB]];
}
const cellXY = i => [RGEO.gx + (i % RGEO.W) * RGEO.cs, RGEO.gy + Math.floor(i / RGEO.W) * RGEO.cs];
const solved = (rd, board, i) => (board[i] && board[i] !== RIDDLE_BG ? board[i] : RIDDLE_BG) === rd.sol[i];

function startRiddle(id, restore) {
  MODE = 'riddle'; G = null; MG = null; PG = null;
  closeOverlay();
  setChrome('riddle');
  const rd = getRiddle(id);
  const n = rd.W * rd.H;
  RG = { id, rd, board: new Array(n).fill(null), locked: new Array(n).fill(false), sel: rd.paint[0], hour: 'S',
    won: false, master: false, winShown: false, peek: null, hints: 0, guessed: !!(save.riddles[id] && save.riddles[id].guessed) };
  for (const i of rd.givens) { RG.board[i] = rd.sol[i]; RG.locked[i] = true; }
  if (restore && restore.board) { RG.board = restore.board; RG.locked = restore.locked; RG.hour = restore.hour || 'S'; }
  buildRiddleScene();
  renderRiddleUI();
  drawRiddle();
}

function buildRiddleScene() {
  const rd = RG.rd;
  RGEO = riddleGeo(rd);
  const g = RGEO;
  scene.setAttribute('viewBox', `0 0 400 ${g.VH.toFixed(0)}`);
  scene.innerHTML = '';
  const defs = el('defs', {}, scene);
  defs.innerHTML = `
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1520"/><stop offset="1" stop-color="#0d0b11"/></linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e0c12"/><stop offset=".45" stop-color="#2b2532"/><stop offset="1" stop-color="#0e0c12"/></linearGradient>
    <linearGradient id="floorg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1922"/><stop offset="1" stop-color="#2a2430"/></linearGradient>
    <radialGradient id="rsheen" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".6" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>`;
  el('rect', { x: 0, y: 0, width: 400, height: g.VH, fill: 'url(#wall)' }, scene);
  el('rect', { x: 0, y: 0, width: 22, height: g.FT, fill: 'url(#pillar)' }, scene);
  el('rect', { x: 378, y: 0, width: 22, height: g.FT, fill: 'url(#pillar)' }, scene);
  // Window recess and arch head
  const pad = 10, ox = g.gx - pad, ow = g.gw + pad * 2;
  el('path', { d: `M${ox},${g.sill + 6}L${ox},${g.gy}Q${ox},${g.top + g.archH * .2} 200,${g.top - 6}Q${ox + ow},${g.top + g.archH * .2} ${ox + ow},${g.gy}L${ox + ow},${g.sill + 6}Z`,
    fill: '#08070a', stroke: '#3a3342', 'stroke-width': 3 }, scene);
  el('rect', { x: ox - 8, y: g.sill + 5, width: ow + 16, height: 8, rx: 2, fill: '#3a3342' }, scene);
  layers.dial = el('g', { transform: 'translate(365,26)' }, scene);
  el('path', { d: 'M-18,8A18,18 0 0 1 18,8', fill: 'none', stroke: '#5b5163', 'stroke-width': 1.2, 'stroke-dasharray': '2 3' }, layers.dial);
  el('line', { x1: -24, y1: 8, x2: 24, y2: 8, stroke: '#5b5163', 'stroke-width': 1 }, layers.dial);
  layers.sun = el('circle', { r: 4.5, fill: '#ffd36b' }, layers.dial);
  rLayers.head = el('g', {}, scene);
  rLayers.beams = el('g', { style: 'mix-blend-mode:screen', 'pointer-events': 'none' }, scene);
  rLayers.glass = el('g', {}, scene);
  rLayers.master = el('g', {}, scene);
  rLayers.sketch = el('g', { 'pointer-events': 'none' }, scene);
  rLayers.floor = el('g', {}, scene);
  rLayers.chips = el('g', { 'pointer-events': 'none' }, scene);
  rLayers.peek = el('g', { 'pointer-events': 'none' }, scene);
  drawRiddleHead(false);
}

// Rose in the arch head: dim until the picture is revealed.
function drawRiddleHead(lit) {
  const g = RGEO, gp = rLayers.head; gp.innerHTML = '';
  const cy = g.top + g.archH * .58, R = Math.min(g.archH * .4, g.gw * .2);
  const cols = lit ? RG.rd.paint.map(k => RCOL[k]) : ['#2a2531', '#241f2b'];
  el('circle', { cx: 200, cy, r: R + 3, fill: '#09080b', stroke: '#3a3342', 'stroke-width': 2.5 }, gp);
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4 - Math.PI / 2;
    const p0 = polar(200, cy, R * .25, a), p1 = polar(200, cy, R * .95, a);
    const c1 = polar(200, cy, R * .6, a - .38), c2 = polar(200, cy, R * .6, a + .38);
    el('path', { d: `M${fx(p0)}Q${fx(c1)} ${fx(p1)}Q${fx(c2)} ${fx(p0)}Z`, fill: cols[k % cols.length], stroke: CAME, 'stroke-width': 1.6 }, gp);
  }
  el('circle', { cx: 200, cy, r: R * .25, fill: lit ? GILT : '#332d3a', stroke: CAME, 'stroke-width': 1.6 }, gp);
  for (const s of [-1, 1]) {
    const x = 200 + s * (g.gw * .36), y = g.gy - g.archH * .18, r = Math.min(10, g.gw * .07);
    el('circle', { cx: x, cy: y, r, fill: lit ? GILT : '#2a2531', stroke: CAME, 'stroke-width': 1.4 }, gp);
  }
}

function riddleCounts(line) { return lineCounts(line, RG.board, RIDDLE_BG); }
function stoneState(h, k) {
  const tgt = RG.rd.clues[h][k], cur = riddleCounts(RG.rd.lines[h][k]);
  const cols = RG.rd.paint.filter(c => (tgt[c] || 0) > 0 || (cur[c] || 0) > 0);
  const chips = cols.map(c => ({ c, t: tgt[c] || 0, n: cur[c] || 0 }));
  return { chips, done: chips.every(x => x.t === x.n) };
}

function drawRiddle() {
  const rd = RG.rd, g = RGEO, h = RG.hour;
  const s = HOURS[h].shift;
  layers.sun.setAttribute('cx', (-s * 18).toFixed(1));
  layers.sun.setAttribute('cy', (8 - 18 * Math.sqrt(1 - s * s)).toFixed(1));

  // Panes
  const gl = rLayers.glass; gl.innerHTML = '';
  if (!RG.master) {
    for (let i = 0; i < rd.W * rd.H; i++) {
      const [x, y] = cellXY(i), p = RG.board[i];
      if (!p) el('rect', { x, y, width: g.cs, height: g.cs, fill: '#13101a' }, gl);
      else if (p === RIDDLE_BG) {
        el('rect', { x, y, width: g.cs, height: g.cs, fill: '#2a2632' }, gl);
        el('circle', { cx: x + g.cs / 2, cy: y + g.cs / 2, r: g.cs * .07, fill: '#5d5566' }, gl);
      } else {
        el('rect', { x, y, width: g.cs, height: g.cs, fill: RCOL[p] }, gl);
        el('rect', { x, y, width: g.cs, height: g.cs, fill: 'url(#rsheen)' }, gl);
      }
      if (RG.locked[i]) el('circle', { cx: x + 4.5, cy: y + 4.5, r: 2, fill: GILT, stroke: CAME, 'stroke-width': .8 }, gl);
    }
    let d = '';
    for (let c = 0; c <= rd.W; c++) d += `M${g.gx + c * g.cs},${g.gy}v${g.gh}`;
    for (let r = 0; r <= rd.H; r++) d += `M${g.gx},${g.gy + r * g.cs}h${g.gw}`;
    el('path', { d, stroke: CAME, 'stroke-width': 2.2, fill: 'none' }, gl);
  }

  // The glazier's cartoon, earned by answering the riddle.
  const sk = rLayers.sketch; sk.innerHTML = '';
  if (RG.guessed && !RG.master) {
    let d = '';
    const fig = i => rd.sol[i] !== RIDDLE_BG;
    for (let i = 0; i < rd.W * rd.H; i++) {
      if (!fig(i)) continue;
      const c = i % rd.W, r = Math.floor(i / rd.W), [x, y] = cellXY(i);
      if (r === 0 || !fig(i - rd.W)) d += `M${x},${y}h${g.cs}`;
      if (r === rd.H - 1 || !fig(i + rd.W)) d += `M${x},${y + g.cs}h${g.cs}`;
      if (c === 0 || !fig(i - 1)) d += `M${x},${y}v${g.cs}`;
      if (c === rd.W - 1 || !fig(i + 1)) d += `M${x + g.cs},${y}v${g.cs}`;
    }
    el('path', { d, stroke: '#fff1c2', 'stroke-width': 1.6, 'stroke-dasharray': '3 2.5', fill: 'none', opacity: .7, 'stroke-linecap': 'round' }, sk);
  }

  // Beams, each tinted by the glass it passed through
  const bm = rLayers.beams; bm.innerHTML = '';
  const fl = rLayers.floor; fl.innerHTML = '';
  const ch = rLayers.chips; ch.innerHTML = '';
  const lines = rd.lines[h], n = lines.length;
  el('polygon', { points: pts([[16, g.FT - 4], [384, g.FT - 4], [400, g.FB + 6], [0, g.FB + 6]]), fill: '#0d0b10' }, fl);
  lines.forEach((line, k) => {
    const q = stoneQuad(k, n);
    const last = line[line.length - 1], [x, y] = cellXY(last);
    let rgb = [0, 0, 0], m = 0;
    for (const i of line) { const p = RG.board[i] || (RG.master ? rd.sol[i] : null); if (p && p !== RIDDLE_BG) { const v = rgbOf(RCOL[p]); rgb = rgb.map((a, j) => a + v[j]); m++; } }
    const col = m ? `rgb(${rgb.map(v => Math.round(Math.min(255, v / m * 1.25)))})` : '#fff0cc';
    el('polygon', { points: pts([[x + 2, y + g.cs], [x + g.cs - 2, y + g.cs], q[1], q[0]]), fill: col, opacity: m ? .22 : .07 }, bm);
    const st = stoneState(h, k);
    el('polygon', { points: pts(q), fill: 'url(#floorg)', stroke: '#0a090c', 'stroke-width': 1.5 }, fl);
    if (m) el('polygon', { points: pts(q), fill: col, opacity: .28 }, fl);
    if (st.done && st.chips.length) el('polygon', { points: pts(q), fill: '#ffe9a8', opacity: .12 }, fl);
    // Count chips
    const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, R = g.chipR;
    if (!st.chips.length) { el('circle', { cx, cy: g.FT + 10 + R, r: 1.6, fill: '#5d5566' }, ch); return; }
    st.chips.forEach((cp, j) => {
      const cy = g.FT + 9 + R + j * (2 * R + 3);
      const ring = cp.n === cp.t ? '#ffe9a8' : cp.n > cp.t ? '#ff5a5a' : '#09080b';
      el('circle', { cx, cy, r: R, fill: RCOL[cp.c], stroke: ring, 'stroke-width': cp.n === cp.t || cp.n > cp.t ? 2 : 1.2, opacity: cp.t === 0 ? .8 : 1 }, ch);
      const t = el('text', { x: cx, y: cy + R * .38, 'text-anchor': 'middle', 'font-size': (R * 1.15).toFixed(1), 'font-family': 'Georgia, serif', 'font-weight': 'bold',
        fill: cp.c === 'W' || cp.c === 'Y' ? '#1a1208' : '#fff6e6' }, ch);
      t.textContent = cp.t;
    });
  });

  // Peek: the beam's path through the window
  const pk = rLayers.peek; pk.innerHTML = '';
  if (RG.peek !== null && RG.peek.hour === h) {
    for (const i of lines[RG.peek.k]) { const [x, y] = cellXY(i); el('rect', { x: x + 1.5, y: y + 1.5, width: g.cs - 3, height: g.cs - 3, fill: '#fff3c4', 'fill-opacity': .12, stroke: '#fff3c4', 'stroke-width': 1.6, 'stroke-dasharray': '3 2' }, pk); }
    el('polygon', { points: pts(stoneQuad(RG.peek.k, n)), fill: 'none', stroke: '#fff3c4', 'stroke-width': 1.6, 'stroke-dasharray': '3 2' }, pk);
  }
}

// ---- riddle UI
function rgemIcon(c) {
  if (c === RIDDLE_BG) return `<svg viewBox="0 0 30 34"><rect x="4" y="5" width="22" height="26" rx="2" fill="#2a2632" stroke="#09080b" stroke-width="1.6"/><circle cx="15" cy="18" r="2.4" fill="#5d5566"/></svg>`;
  const col = RCOL[c];
  return `<svg viewBox="0 0 30 34"><path d="M15 2L27 12L22 32H8L3 12Z" fill="${col}"/><path d="M15 2L27 12L15 15L3 12Z" fill="#fff" opacity=".3"/><path d="M15 15L22 32H8Z" fill="#000" opacity=".2"/><path d="M15 2L27 12L22 32H8L3 12Z" fill="none" stroke="#09080b" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function renderRiddleUI() {
  const rd = RG.rd;
  $('#lv-num').textContent = 'RIDDLE ' + toRoman(rd.id + 1) + ' OF ' + toRoman(RIDDLES.length);
  $('#lv-name').textContent = rd.name;
  $('#lv-name').classList.toggle('long', rd.name.length > 19);
  const box = $('#riddle');
  const ans = rd.answers[0];
  box.innerHTML = `<p class="verse">“${rd.verse}”</p>` + (RG.guessed
    ? `<p class="answered">Answered: <b>${ans}</b>. The glazier has sketched its outline.</p>`
    : `<form id="guess" autocomplete="off"><input id="guess-in" type="text" placeholder="Name the answer" aria-label="Your answer" enterkeyhint="done"><button class="btn small" type="submit">Answer</button></form>`)
    + (rd.help && !RG.master ? `<p class="help">${rd.help}</p>` : '');
  const f = $('#guess');
  if (f) f.addEventListener('submit', e => { e.preventDefault(); guessRiddle($('#guess-in').value); });
  renderRiddleHours();
  renderRiddleTray();
}
function renderRiddleHours() {
  const box = $('#hours'); box.innerHTML = '';
  for (const h of HOUR_ORDER) {
    const n = RG.rd.lines[h].length;
    let done = 0;
    for (let k = 0; k < n; k++) if (stoneState(h, k).done) done++;
    const b = document.createElement('button');
    b.className = 'hour' + (RG.hour === h ? ' on' : '') + (done === n ? ' done' : '');
    b.innerHTML = `${sunIcon(h, RG.hour === h)}<span class="hn">${HOURS[h].name}</span><span class="hs">${done} of ${n} true</span>`;
    b.onclick = () => { if (RG.won && !RG.winShown) return; if (RG.hour !== h) { RG.hour = h; RG.peek = null; sfx.bell(h); renderRiddleHours(); drawRiddle(); } };
    box.appendChild(b);
  }
}
function renderRiddleTray() {
  const box = $('#tray'); box.innerHTML = '';
  for (const c of [...RG.rd.paint, RIDDLE_BG]) {
    const b = document.createElement('button');
    b.className = 'gem' + (RG.sel === c ? ' sel' : '');
    b.innerHTML = `${rgemIcon(c)}<span class="gn">${RNAME[c]}</span>`;
    b.setAttribute('aria-label', `${RNAME[c]} glass`);
    b.onclick = () => { RG.sel = c; sfx.paint(c); renderRiddleTray(); };
    box.appendChild(b);
  }
}
function normAnswer(s) { return s.toLowerCase().replace(/[^a-z ]/g, '').replace(/^(a|an|the) /, '').trim(); }
function guessRiddle(text) {
  const g = normAnswer(text);
  if (!g) return;
  if (RG.rd.answers.map(normAnswer).includes(g)) {
    RG.guessed = true;
    save.riddles[RG.id] = { ...(save.riddles[RG.id] || {}), guessed: true };
    persist();
    sfx.bell('S');
    toast('Correct. The glazier sketches the outline for you.');
    renderRiddleUI(); drawRiddle();
  } else {
    const inp = $('#guess-in');
    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
    toast('Not that. Read it again, or let the light tell you.');
  }
}

// ---- painting
function svgPoint(e) {
  const p = scene.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(scene.getScreenCTM().inverse());
}
function cellAt(p) {
  const g = RGEO, c = Math.floor((p.x - g.gx) / g.cs), r = Math.floor((p.y - g.gy) / g.cs);
  return c >= 0 && c < g.W && r >= 0 && r < g.H ? r * g.W + c : -1;
}
function stoneAt(p) {
  const g = RGEO;
  if (p.y < g.FT - 6 || p.y > g.FB + 6) return -1;
  const n = RG.rd.lines[RG.hour].length, t = (p.y - g.FT) / (g.FB - g.FT);
  const left = 22 + (4 - 22) * t, w = (356 + (392 - 356) * t) / n;
  const k = Math.floor((p.x - left) / w);
  return k >= 0 && k < n ? k : -1;
}
let lastPaintSound = 0;
function paintCell(i) {
  if (RG.locked[i]) return false;
  const v = RG.dragMode === 'erase' ? null : RG.sel;
  if (RG.board[i] === v) return false;
  RG.board[i] = v;
  const now = performance.now();
  if (now - lastPaintSound > 45) { v ? sfx.paint(v) : sfx.lift(); lastPaintSound = now; }
  return true;
}
scene.addEventListener('pointerdown', e => {
  if (MODE !== 'riddle' || !RG) return;
  if (RG.won && !RG.winShown) { showRiddleWin(); return; }
  const p = svgPoint(e);
  const i = cellAt(p);
  if (i >= 0) {
    if (RG.master) return;
    if (RG.locked[i]) { toast('This pane is old glass, set long ago.'); return; }
    RG.peek = null;
    RG.dragMode = RG.board[i] === RG.sel ? 'erase' : 'paint';
    RG.dragging = true;
    try { scene.setPointerCapture(e.pointerId); } catch (err) {}
    if (paintCell(i)) { drawRiddle(); renderRiddleHours(); }
    return;
  }
  const k = stoneAt(p);
  if (k >= 0) riddlePeek(k);
});
scene.addEventListener('pointermove', e => {
  if (MODE !== 'riddle' || !RG || !RG.dragging) return;
  const i = cellAt(svgPoint(e));
  if (i >= 0 && paintCell(i)) { drawRiddle(); renderRiddleHours(); }
});
const endDrag = () => { if (MODE === 'riddle' && RG && RG.dragging) { RG.dragging = false; checkRiddleWin(); } };
scene.addEventListener('pointerup', endDrag);
scene.addEventListener('pointercancel', endDrag);

let rPeekTimer;
function riddlePeek(k) {
  const h = RG.hour, line = RG.rd.lines[h][k], tgt = RG.rd.clues[h][k];
  RG.peek = { hour: h, k };
  const parts = RG.rd.paint.filter(c => tgt[c]).map(c => `${tgt[c]} ${RNAME[c].toLowerCase()}`);
  const plain = tgt[RIDDLE_BG] || 0;
  toast(`${line.length} panes: ` + (parts.length ? parts.join(', ') + (plain ? `, ${plain} plain` : '') : 'all plain'));
  drawRiddle();
  clearTimeout(rPeekTimer);
  rPeekTimer = setTimeout(() => { if (RG && RG.peek && RG.peek.k === k) { RG.peek = null; drawRiddle(); } }, 2600);
}

function checkRiddleWin() {
  const rd = RG.rd;
  if (RG.won) return;
  for (let i = 0; i < rd.W * rd.H; i++) if (!solved(rd, RG.board, i)) return;
  RG.won = true;
  save.riddles[RG.id] = { ...(save.riddles[RG.id] || {}), solved: true };
  persist();
  sfx.win();
  RG.master = true;
  RG.peek = null;
  drawRiddleHead(true);
  rLayers.master.innerHTML = '';
  drawRiddleMaster(rLayers.master, rd, RGEO, 'rm', !reduceMotion);
  drawRiddle();
  const id = RG.id;
  RG.winTimer = setTimeout(() => { if (RG && RG.id === id) showRiddleWin(); }, reduceMotion ? 300 : 2900);
}

// The revealed picture, re-leaded: pieces follow colour boundaries, the
// ground becomes blue quarries, and a banner names the answer.
function drawRiddleMaster(parent, rd, g, pfx, animate) {
  const { W, H, sol } = rd, n = W * H, cs = g.cs;
  const rng = mulberry32(900 + rd.id);
  const root = el('g', {}, parent);
  const defs = el('defs', {}, root);
  const at = i => [g.gx + (i % W) * cs, g.gy + Math.floor(i / W) * cs];
  const P = (tag, attrs, gp, row) => {
    const e = el(tag, attrs, gp);
    if (animate) { e.classList.add('mw'); e.style.animationDelay = (row / H * 1.5 + rng() * .2).toFixed(2) + 's'; }
    return e;
  };
  // Connected pieces of one colour share one shade of glass.
  const comp = new Array(n).fill(-1), shadeOf = [];
  for (let i = 0; i < n; i++) {
    if (comp[i] >= 0) continue;
    const id = shadeOf.length, stack = [i];
    shadeOf.push((rng() - .5) * .22);
    comp[i] = id;
    while (stack.length) {
      const j = stack.pop(), c = j % W;
      for (const k of [j - W, j + W, c > 0 ? j - 1 : -1, c < W - 1 ? j + 1 : -1]) {
        if (k >= 0 && k < n && comp[k] < 0 && sol[k] === sol[j]) { comp[k] = id; stack.push(k); }
      }
    }
  }
  const bgClip = el('clipPath', { id: `${pfx}-bg` }, defs);
  const figClip = el('clipPath', { id: `${pfx}-fig` }, defs);
  for (let i = 0; i < n; i++) {
    const [x, y] = at(i), r = Math.floor(i / W);
    const isBg = sol[i] === RIDDLE_BG;
